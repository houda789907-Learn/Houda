<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أذكار عامة | Houda App</title>
    <style>
        :root { 
            --gold: #d4af37; 
            --deep-sky: #0a192f; 
            --night-blue: #020c1b;
            --white: #ffffff;
        }
        
        body { 
            background: radial-gradient(circle at center, var(--deep-sky) 0%, var(--night-blue) 100%); 
            color: var(--white); font-family: 'Segoe UI', sans-serif; 
            margin: 0; padding: 20px; min-height: 100vh;
            text-align: center;
        }

        header {
            position: sticky; top: 0; background: var(--night-blue);
            padding: 15px; z-index: 100; border-bottom: 2px solid var(--gold);
            margin-bottom: 25px; border-radius: 0 0 20px 20px;
        }

        h1 { color: var(--gold); margin: 0; font-size: 1.6rem; }

        .adhkar-container { max-width: 600px; margin: 0 auto; display: grid; gap: 15px; }

        .adhkar-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 15px;
            padding: 20px;
            text-align: right;
            position: relative;
            transition: 0.3s;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .adhkar-card:active { transform: scale(0.97); background: rgba(212, 175, 55, 0.1); }

        .category-tag {
            color: var(--gold); font-size: 0.8rem; font-weight: bold;
            background: rgba(212, 175, 55, 0.1);
            padding: 2px 10px; border-radius: 5px;
            margin-bottom: 10px; display: inline-block;
        }

        .adhkar-text { font-size: 1.1rem; line-height: 1.8; color: var(--white); margin: 0; }

        .back-btn {
            display: inline-block; margin: 30px 0; color: var(--gold);
            text-decoration: none; border: 1px solid var(--gold);
            padding: 12px 35px; border-radius: 30px; transition: 0.3s;
        }

        #stars-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }
        .star { position: absolute; background: white; border-radius: 50%; animation: twinkle var(--duration) infinite; }
        @keyframes twinkle { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }

        #toast {
            visibility: hidden; min-width: 200px; background-color: var(--gold);
            color: var(--night-blue); text-align: center; border-radius: 50px;
            padding: 10px; position: fixed; z-index: 1000; bottom: 30px;
            left: 50%; transform: translateX(-50%); font-weight: bold;
        }
        #toast.show { visibility: visible; animation: fadeInOut 2s; }
    </style>
</head>
<body>

    <div id="stars-container"></div>
    
    <header>
        <h1>📚 أذكار عامة متنوعة</h1>
        <p style="font-size: 0.8rem; color: var(--gold); margin-top: 5px;">أذكار يحتاجها المسلم في يومه</p>
    </header>

    <div class="adhkar-container" id="adhkar-list">
        </div>

    <a href="index.html" class="back-btn">🏠 العودة للرئيسية</a>

    <div id="toast">تم النسخ ✅</div>

    <script>
        const generalAdhkar = [
            { c: "عند الاستيقاظ", t: "الحمد لله الذي أحيانا بعد ما أماتنا وإليه النشور." },
            { c: "عند لبس الثوب", t: "الحمد لله الذي كساني هذا الثوب ورزقنيه من غير حول مني ولا قوة." },
            { c: "دعاء دخول الخلاء", t: "باسم الله، اللهم إني أعوذ بك من الخبث والخبائث." },
            { c: "دعاء الخروج من الخلاء", t: "غفرانك." },
            { c: "قبل الوضوء", t: "باسم الله." },
            { c: "بعد الفراغ من الوضوء", t: "أشهد أن لا إله إلا الله وحده لا شريك له وأشهد أن محمداً عبده ورسوله." },
            { c: "عند دخول المنزل", t: "باسم الله ولجنا، وباسم الله خرجنا، وعلى ربنا توكلنا، ثم ليسلم على أهله." },
            { c: "عند الخروج من المنزل", t: "باسم الله، توكلت على الله، ولا حول ولا قوة إلا بالله." },
            { c: "دعاء الذهاب إلى المسجد", t: "اللهم اجعل في قلبي نوراً، وفي لساني نوراً، واجعل في سمعي نوراً، وفي بصري نوراً." },
            { c: "عند دخول المسجد", t: "باسم الله، والصلاة والسلام على رسول الله، اللهم افتح لي أبواب رحمتك." },
            { c: "عند الخروج من المسجد", t: "باسم الله والصلاة والسلام على رسول الله، اللهم إني أسألك من فضلك." },
            { c: "قبل الطعام", t: "باسم الله. (فإذا نسي قال: باسم الله في أوله وآخره)" },
            { c: "عند الفراغ من الطعام", t: "الحمد لله الذي أطعمني هذا، ورزقنيه، من غير حول مني ولا قوة." },
            { c: "دعاء العطاس", t: "يقول: الحمد لله. (ويرد عليه أخوه: يرحمك الله. فيقول هو: يهديكم الله ويصلح بالكم)" },
            { c: "عند رؤية ما يحب", t: "الحمد لله الذي بنعمته تتم الصالحات." },
            { c: "عند رؤية ما يكره", t: "الحمد لله على كل حال." }
        ];

        const list = document.getElementById('adhkar-list');
        generalAdhkar.forEach(dhikr => {
            const card = document.createElement('div');
            card.className = 'adhkar-card';
            card.onclick = () => copyText(dhikr.t);
            card.innerHTML = `
                <span class="category-tag">${dhikr.c}</span>
                <p class="adhkar-text">${dhikr.t}</p>
            `;
            list.appendChild(card);
        });

        function copyText(text) {
            navigator.clipboard.writeText(text).then(() => {
                const toast = document.getElementById("toast");
                toast.className = "show";
                setTimeout(() => { toast.className = ""; }, 2000);
                if (navigator.vibrate) navigator.vibrate(50);
            });
        }

        const container = document.getElementById('stars-container');
        for (let i = 0; i < 50; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            star.style.width = Math.random() * 2 + 'px';
            star.style.height = star.style.width;
            star.style.top = Math.random() * 100 + '%';
            star.style.left = Math.random() * 100 + '%';
            star.style.setProperty('--duration', (Math.random() * 3 + 2) + 's');
            container.appendChild(star);
        }
    </script>
</body>
</html>
