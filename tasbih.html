<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>السبحة الإلكترونية | Houda App</title>
    <style>
        :root { 
            --gold: #d4af37; 
            --deep-sky: #0a192f; 
            --night-blue: #020c1b;
            --white: #ffffff;
        }
        
        body { 
            background: radial-gradient(circle at center, var(--deep-sky) 0%, var(--night-blue) 100%); 
            color: var(--white); font-family: 'Segoe UI', sans-serif; 
            margin: 0; padding: 0; height: 100vh; overflow: hidden;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }

        #stars-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }
        .star { position: absolute; background: white; border-radius: 50%; animation: twinkle var(--duration) infinite; }

        .tasbih-container { text-align: center; z-index: 10; }

        /* دائرة التسبيح الكبيرة */
        .counter-circle {
            width: 250px; height: 250px;
            border: 8px solid var(--gold);
            border-radius: 50%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            margin-bottom: 30px;
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.4), inset 0 0 20px rgba(212, 175, 55, 0.2);
            cursor: pointer;
            user-select: none;
            transition: 0.1s;
            background: rgba(255, 255, 255, 0.02);
        }

        .counter-circle:active { transform: scale(0.95); background: rgba(212, 175, 55, 0.1); }

        #count { font-size: 5rem; font-weight: bold; color: var(--gold); margin: 0; }
        .dhikr-text { font-size: 1.2rem; margin-top: 10px; opacity: 0.8; }

        /* الأزرار السفلى */
        .controls { display: flex; gap: 20px; }
        
        .btn {
            background: none; border: 1px solid var(--gold); color: var(--gold);
            padding: 10px 20px; border-radius: 50px; cursor: pointer;
            font-size: 0.9rem; transition: 0.3s;
        }
        .btn:hover { background: var(--gold); color: var(--night-blue); }

        .total-counter {
            margin-top: 40px; font-size: 0.9rem; opacity: 0.6;
            border-top: 1px solid rgba(212, 175, 55, 0.2); padding-top: 10px;
        }

        .back-link { position: absolute; top: 20px; right: 20px; color: var(--gold); text-decoration: none; font-size: 1.5rem; }

        @keyframes twinkle { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
    </style>
</head>
<body>

    <div id="stars-container"></div>
    <a href="index.html" class="back-link">✕</a>

    <div class="tasbih-container">
        <h2 style="color: var(--gold); margin-bottom: 20px;">السبحة الإلكترونية</h2>
        
        <div class="counter-circle" onclick="increment()">
            <span id="count">0</span>
            <span class="dhikr-text" id="current-dhikr">سبحان الله</span>
        </div>

        <div class="controls">
            <button class="btn" onclick="reset()">تصفير العداد</button>
            <button class="btn" onclick="changeDhikr()">تغيير الذكر</button>
        </div>

        <div class="total-counter">
            إجمالي التسبيحات اليوم: <span id="total-count">0</span>
        </div>
    </div>

    <script>
        let count = 0;
        let totalCount = localStorage.getItem('totalTasbih') || 0;
        document.getElementById('total-count').innerText = totalCount;

        const dhikrList = ["سبحان الله", "الحمد لله", "لا إله إلا الله", "الله أكبر", "أستغفر الله", "اللهم صلِّ على محمد"];
        let dhikrIndex = 0;

        function increment() {
            count++;
            totalCount++;
            document.getElementById('count').innerText = count;
            document.getElementById('total-count').innerText = totalCount;
            
            // حفظ الإجمالي في الموبايل
            localStorage.setItem('totalTasbih', totalCount);

            // اهتزاز الموبايل (حركة احترافية)
            if (navigator.vibrate) {
                navigator.vibrate(40); 
            }

            // تأثير بصري عند كل 33 تسبيحة
            if (count % 33 === 0) {
                if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
                document.getElementById('count').style.color = "#4ade80";
                setTimeout(() => { document.getElementById('count').style.color = "#d4af37"; }, 500);
            }
        }

        function reset() {
            if (confirm("هل تريد تصفير العداد الحالي؟")) {
                count = 0;
                document.getElementById('count').innerText = count;
            }
        }

        function changeDhikr() {
            dhikrIndex = (dhikrIndex + 1) % dhikrList.length;
            document.getElementById('current-dhikr').innerText = dhikrList[dhikrIndex];
            count = 0;
            document.getElementById('count').innerText = count;
        }

        // نجوم الخلفية
        const container = document.getElementById('stars-container');
        for (let i = 0; i < 50; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            star.style.width = Math.random() * 3 + 'px';
            star.style.height = star.style.width;
            star.style.top = Math.random() * 100 + '%';
            star.style.left = Math.random() * 100 + '%';
            star.style.setProperty('--duration', (Math.random() * 3 + 2) + 's');
            container.appendChild(star);
        }
    </script>
</body>
</html>
