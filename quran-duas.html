<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أدعية قرآنية | Houda App</title>
    <style>
        :root { 
            --gold: #d4af37; 
            --deep-sky: #0a192f; 
            --night-blue: #020c1b;
            --white: #ffffff;
        }
        
        body { 
            background: radial-gradient(circle at center, var(--deep-sky) 0%, var(--night-blue) 100%); 
            color: var(--white); font-family: 'Segoe UI', sans-serif; 
            margin: 0; padding: 20px; min-height: 100vh;
            text-align: center;
        }

        header {
            position: sticky; top: 0; background: var(--night-blue);
            padding: 10px; z-index: 100; border-bottom: 1px solid var(--gold);
            margin-bottom: 20px;
        }

        h1 { color: var(--gold); margin: 0; font-size: 1.5rem; }

        .dua-container {
            max-width: 600px; margin: 0 auto;
            display: grid; gap: 15px;
        }

        .dua-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 15px;
            padding: 20px;
            position: relative;
            transition: 0.3s;
            cursor: pointer;
            text-align: right;
        }

        .dua-card:active { transform: scale(0.98); background: rgba(212, 175, 55, 0.1); }

        .dua-header {
            display: flex; justify-content: space-between;
            margin-bottom: 10px; border-bottom: 1px solid rgba(212, 175, 55, 0.1);
            padding-bottom: 5px;
        }

        .dua-num { color: var(--gold); font-weight: bold; font-size: 0.9rem; }
        .surah-info { color: var(--gold); font-size: 0.8rem; opacity: 0.7; }

        .dua-text { font-size: 1.15rem; line-height: 1.8; color: var(--white); margin: 0; }

        .back-btn {
            display: inline-block; margin: 30px 0; color: var(--gold);
            text-decoration: none; border: 1px solid var(--gold);
            padding: 10px 30px; border-radius: 25px; transition: 0.3s;
        }

        /* تأثير النجوم */
        #stars-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }
        .star { position: absolute; background: white; border-radius: 50%; animation: twinkle var(--duration) infinite; }
        @keyframes twinkle { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }

        #toast {
            visibility: hidden; min-width: 200px; background-color: var(--gold);
            color: var(--night-blue); text-align: center; border-radius: 50px;
            padding: 10px; position: fixed; z-index: 1000; bottom: 30px;
            left: 50%; transform: translateX(-50%); font-weight: bold;
        }
        #toast.show { visibility: visible; animation: fadeInOut 2s; }
    </style>
</head>
<body>

    <div id="stars-container"></div>
    
    <header>
        <h1>📖 أدعية القرآن الكريم</h1>
        <p style="font-size: 0.8rem; color: var(--gold);">مرتبة حسب سور المصحف</p>
    </header>

    <div class="dua-container" id="dua-list">
        </div>

    <a href="index.html" class="back-btn">🏠 العودة للرئيسية</a>

    <div id="toast">تم نسخ الدعاء ✅</div>

    <script>
        const allDuas = [
            { n: 1, t: "اهْدِنَا الصِّرَاطَ الْمُسْتَقِيمَ * صِرَاطَ الَّذِينَ أَنْعَمْتَ عَلَيْهِمْ غَيْرِ الْمَغْضُوبِ عَلَيْهِمْ وَلَا الضَّالِّينَ", s: "الفاتحة: 6، 7" },
            { n: 2, t: "رَبَّنَا تَقَبَّلْ مِنَّا إِنَّكَ أَنْتَ السَّمِيعُ الْعَلِيمُ", s: "البقرة: 127" },
            { n: 3, t: "رَبَّنَا آتِنَا فِي الدُّنْيَا حَسَنَةً وَفِي الْآخِرَةِ حَسَنَةً وَقِنَا عَذَابَ النَّارِ", s: "البقرة: 201" },
            { n: 4, t: "رَبَّنَا أَفْرِغْ عَلَيْنَا صَبْرًا وَثَبِّتْ أَقْدَامَنَا وَانْصُرْنَا عَلَى الْقَوْمِ الْكَافِرِينَ", s: "البقرة: 250" },
            { n: 5, t: "رَبَّنَا لَا تُؤَاخِذْنَا إِنْ نَسِينَا أَوْ أَخْطَأْنَا", s: "البقرة: 286" },
            { n: 6, t: "رَبَّنَا وَلَا تَحْمِلْ عَلَيْنَا إِصْرًا كَمَا حَمَلْتَهُ عَلَى الَّذِينَ مِنْ قَبْلِنَا", s: "البقرة: 286" },
            { n: 7, t: "رَبَّنَا وَلَا تُحَمِّلْنَا مَا لَا طَاقَةَ لَنَا بِهِ وَاعْفُ عَنَّا وَاغْفِرْ لَنَا وَارْحَمْنَا أَنْتَ مَوْلَانَا فَانْصُرْنَا عَلَى الْقَوْمِ الْكَافِرِينَ", s: "البقرة: 286" },
            { n: 8, t: "رَبَّنَا لَا تُزِغْ قُلُوبَنَا بَعْدَ إِذْ هَدَيْتَنَا وَهَبْ لَنَا مِنْ لَدُنْكَ رَحْمَةً إِنَّكَ أَنْتَ الْوَهَّابُ", s: "آل عمران: 8" },
            { n: 9, t: "رَبَّنَا إِنَّنَا آمَنَّا فَاغْفِرْ لَنَا ذُنُوبَنَا وَقِنَا عَذَابَ النَّارِ", s: "آل عمران: 16" },
            { n: 10, t: "رَبِّ هَبْ لِي مِنْ لَدُنْكَ ذُرِّيَّةً طَيِّبَةً إِنَّكَ سَمِيعُ الدُّعَاءِ", s: "آل عمران: 38" },
            { n: 11, t: "رَبَّنَا آمَنَّا بِمَا أَنْزَلْتَ وَاتَّبَعْنَا الرَّسُولَ فَاكْتُبْنَا مَعَ الشَّاهِدِينَ", s: "آل عمران: 53" },
            { n: 12, t: "رَبَّنَا اغْفِرْ لَنَا ذُنُوبَنَا وَإِسْرَافَنَا فِي أَمْرِنَا وَثَبِّتْ أَقْدَامَنَا وَانْصُرْنَا عَلَى الْقَوْمِ الْكَافِرِينَ", s: "آل عمران: 147" },
            { n: 13, t: "حَسْبُنَا اللَّهُ وَنِعْمَ الْوَكِيلُ", s: "آل عمران: 173" },
            { n: 14, t: "رَبَّنَا مَا خَلَقْتَ هَذَا بَاطِلًا سُبْحَانَكَ فَقِنَا عَذَابَ النَّارِ", s: "آل عمران: 191" },
            { n: 15, t: "رَبَّنَا إِنَّنَا سَمِعْنَا مُنَادِيًا يُنَادِي لِلْإِيمَانِ أَنْ آمِنُوا بِرَبِّكُمْ فَآمَنَّا رَبَّنَا فَاغْفِرْ لَنَا ذُنُوبَنَا وَكَفِّرْ عَنَّا سَيِّئَاتِنَا وَتَوَفَّنَا مَعَ الْأَبْرَارِ", s: "آل عمران: 193" },

            { n: 17, t: "وَاجْعَلْ لَنَا مِنْ لَدُنْكَ وَلِيًّا وَاجْعَلْ لَنَا مِنْ لَدُنْكَ نَصِيرًا", s: "النساء: 75" },
            { n: 18, t: "وَارْزُقْنَا وَأَنْتَ خَيْرُ الرَّازِقِينَ", s: "المائدة: 114" },
            { n: 19, t: "رَبَّنَا ظَلَمْنَا أَنْفُسَنَا وَإِنْ لَمْ تَغْفِرْ لَنَا وَتَرْحَمْنَا لَنَكُونَنَّ مِنَ الْخَاسِرِينَ", s: "الأعراف: 23" },
            { n: 20, t: "رَبَّنَا افْتَحْ بَيْنَنَا وَبَيْنَ قَوْمِنَا بِالْحَقِّ وَأَنْتَ خَيْرُ الْفَاتِحِينَ", s: "الأعراف: 89" },
            { n: 21, t: "رَبَّنَا أَفْرِغْ عَلَيْنَا صَبْرًا وَتَوَفَّنَا مُسْلِمِينَ", s: "الأعراف: 126" },
            { n: 22, t: "فَلَا تُشْمِتْ بِيَ الْأَعْدَاءَ وَلَا تَجْعَلْنِي مَعَ الْقَوْمِ الظَّالِمِينَ", s: "الأعراف: 150" },
            { n: 23, t: "وَأَدْخِلْنَا فِي رَحْمَتِكَ وَأَنْتَ أَرْحَمُ الرَّاحِمِينَ", s: "الأعراف: 151" },
            { n: 24, t: "أَنْتَ وَلِيُّنَا فَاغْفِرْ لَنَا وَارْحَمْنَا وَأَنْتَ خَيْرُ الْغَافِرِينَ", s: "الأعراف: 155" },
            { n: 25, t: "رَبَّنَا لَا تَجْعَلْنَا فِتْنَةً لِلْقَوْمِ الظَّالِمِينَ * وَنَجِّنَا بِرَحْمَتِكَ مِنَ الْقَوْمِ الْكَافِرِينَ", s: "يونس: 85، 86" },
            { n: 26, t: "فَاطِرَ السَّمَاوَاتِ وَالْأَرْضِ أَنْتَ وَلِيِّي فِي الدُّنْيَا وَالْآخِرَةِ تَوفَّنِي مُسْلِمًا وَأَلْحِقْنِي بِالصَّالِحِينَ", s: "يوسف: 101" },
            { n: 27, t: "رَبِّ اجْعَلْنِي مُقِيمَ الصَّلَاةِ وَمِنْ ذُرِّيَّتِي رَبَّنَا وَتَقَبَّلْ دُعَاءِ", s: "إبراهيم: 40" },
            { n: 28, t: "رَبَّنَا اغْفِرْ لِي وَلِوَالِدَيَّ وَلِلْمُؤْمِنِينَ يَوْمَ يَقُومُ الْحِسَابُ", s: "إبراهيم: 41" },

            { n: 30, t: "رَبِّ أَدْخِلْنِي مُدْخَلَ صِدْقٍ وَأَخْرِجْنِي مُخْرَجَ صِدْقٍ وَاجْعَلْ لِي مِنْ لَدُنْكَ سُلْطَانًا نَصِيرًا", s: "الإسراء: 80" },
            { n: 31, t: "رَبَّنَا آتِنَا مِنْ لَدُنْكَ رَحْمَةً وَهَيِّئْ لَنَا مِنْ أَمْرِنَا رَشَدًا", s: "الكهف: 10" },
            { n: 32, t: "رَبِّ اشْرَحْ لِي صَدْرِي * وَيَسِّرْ لِي أَمْرِي", s: "طه: 25، 26" },
            { n: 33, t: "رَبِّ زِدْنِي عِلْمًا", s: "طه: 114" },
            { n: 34, t: "لَا إِلَهَ إِلَّا أَنْتَ سُبْحَانَكَ إِنِّي كُنْتُ مِنَ الظَّالِمِينَ", s: "الأنبياء: 87" },
            { n: 35, t: "رَبِّ لَا تَذَرْنِي فَرْدًا وَأَنْتَ خَيْرُ الْوَارِثِينَ", s: "الأنبياء: 89" },
            { n: 36, t: "رَبِّ أَنْزِلْنِي مُنْزَلًا مُبَارَكًا وَأَنْتَ خَيْرُ الْمُنْزِلِينَ", s: "المؤمنون: 29" },
            { n: 37, t: "رَبِّ أَعُوذُ بِكَ مِنْ هَمَزَاتِ الشَّيَاطِينِ * وَأَعُوذُ بِكَ رَبِّ أَنْ يَحْضُرُونِ", s: "المؤمنون: 97، 98" },
            { n: 38, t: "رَبَّنَا آمَنَّا فَاغْفِرْ لَنَا وَارْحَمْنَا وَأَنْتَ خَيْرُ الرَّاحِمِينَ", s: "المؤمنون: 109" },
            { n: 39, t: "رَبِّ اغْفِرْ وَارْحَمْ وَأَنْتَ خَيْرُ الرَّاحِمِينَ", s: "المؤمنون: 118" },
            { n: 40, t: "رَبَّنَا اصْرِفْ عَنَّا عَذَابَ جَهَنَّمَ إِنَّ عَذَابَهَا كَانَ غَرَامًا * إِنَّهَا سَاءَتْ مُسْتَقَرًّا وَمُقَامًا", s: "الفرقان: 65، 66" },
            { n: 41, t: "رَبَّنَا هَبْ لَنَا مِنْ أَزْوَاجِنَا وَذُرِّيَّاتِنَا قُرَّةَ أَعْيُنٍ وَاجْعَلْنَا لِلْمُتَّقِينَ إِمَامًا", s: "الفرقان: 74" },
            { n: 42, t: "وَاجْعَلْ لِي لِسَانَ صِدْقٍ فِي الْآخِرِينَ * وَاجْعَلْنِي مِنْ وَرَثَةِ جَنَّةِ النَّعِيمِ", s: "الشعراء: 84، 85" },

            { n: 49, t: "رَبَّنَا وَسِعْتَ كُلَّ شَيْءٍ رَحْمَةً وَعِلْمًا فَاغْفِرْ لِلَّذِينَ تَابُوا وَاتَّبَعُوا سَبِيلَكَ وَقِهِمْ عَذَابَ الْجَهَيْمِ", s: "غافر: 7" },
            { n: 50, t: "رَبَّنَا وَأَدْخِلْهُمْ جَنَّاتِ عَدْنٍ الَّتِي وَعَدْتَهُمْ وَمَنْ صَلَحَ مِنْ آبَائِهِمْ وَأَزْواجِهِمْ وَذُرِّيَّاتِهِمْ إِنَّكَ أَنْتَ الْعَزِيزُ الْحَكِيمُ * وَقِهِمُ السَّيِّئَاتِ", s: "غافر: 8، 9" },
            { n: 51, t: "رَبَّنَا اكْشِفْ عَنَّا الْعَذَابَ إِنَّا مُؤْمِنُونَ", s: "الدخان: 12" },
            { n: 52, t: "رَبِّ أَوْزِعْنِي أَنْ أَشْكُرَ نِعْمَتَكَ الَّتِي أَنْعَمْتَ عَلَيَّ وَعَلَى وَالِدَيَّ وَأَنْ أَعْمَلَ صَالِحًا تَرْضَاهُ وَأَصْلِحْ لِي فِي ذُرِّيَّتِي", s: "الأحقاف: 15" },

            { n: 54, t: "رَبَّنَا عَلَيْكَ تَوَكَّلْنَا وَإِلَيْكَ أَنَبْنَا وَإِلَيْكَ الْمَصِيرُ", s: "الممتحنة: 4" },
            { n: 55, t: "رَبَّنَا لَا تَجْعَلْنَا فِتْنَةً لِلَّذِينَ كَفَرُوا وَاغْفِرْ لَنَا رَبَّنَا إِنَّكَ أَنْتَ الْعَزِيزُ الْحَكِيمُ", s: "الممتحنة: 5" },
            { n: 56, t: "رَبَّنَا أَتْمِمْ لَنَا نُورَنَا وَاغْفِرْ لَنَا إِنَّكَ عَلَى كُلِّ شَيْءٍ قَدِيرٌ", s: "التحريم: 8" },
            { n: 57, t: "رَبِّ ابْنِ لِي عِنْدَكَ بَيْتًا فِي الْجَنَّةِ", s: "التحريم: 11" },
            { n: 58, t: "رَبِّ اغْفِرْ لِي وَلِوَالِدَيَّ", s: "نوح: 28" }

        const list = document.getElementById('dua-list');

        allDuas.forEach(dua => {
            const card = document.createElement('div');
            card.className = 'dua-card';
            card.onclick = () => copyDua(dua.t, card);
            card.innerHTML = `
                <div class="dua-header">
                    <span class="dua-num">#${dua.n}</span>
                    <span class="surah-info">[${dua.s}]</span>
                </div>
                <p class="dua-text">${dua.t}</p>
                <small style="display:block; margin-top:10px; opacity:0.5; font-size:0.7rem;">اضغط للنسخ</small>
            `;
            list.appendChild(card);
        });

        function copyDua(text, card) {
            navigator.clipboard.writeText(text).then(() => {
                const toast = document.getElementById("toast");
                toast.className = "show";
                setTimeout(() => { toast.className = ""; }, 2000);
                if (navigator.vibrate) navigator.vibrate(50);
            });
        }

        // نجوم الخلفية
        const container = document.getElementById('stars-container');
        for (let i = 0; i < 50; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            star.style.width = Math.random() * 2 + 'px';
            star.style.height = star.style.width;
            star.style.top = Math.random() * 100 + '%';
            star.style.left = Math.random() * 100 + '%';
            star.style.setProperty('--duration', (Math.random() * 3 + 2) + 's');
            container.appendChild(star);
        }
    </script>
</body>
</html>
