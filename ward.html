<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الورد اليومي</title>
    <style>
        body { background-color: #0a0a0a; color: #d4af37; font-family: 'Segoe UI', sans-serif; text-align: center; padding: 20px; }
        .container { border: 2px solid #d4af37; padding: 20px; border-radius: 15px; max-width: 500px; margin: auto; }
        h1 { border-bottom: 1px solid #d4af37; padding-bottom: 10px; }
        .back-btn { display: inline-block; margin-top: 20px; color: #0a0a0a; background: #d4af37; padding: 10px 20px; text-decoration: none; border-radius: 5px; font-weight: bold; }
        p { font-size: 1.5rem; line-height: 2; }
    </style>
</head>
<body>
    <div class="container">
        <h1>الورد اليومي</h1>
        <p>قال تعالى: "فَاصْبِرْ عَلَىٰ مَا يَقُولُونَ وَسَبِّحْ بِحَمْدِ رَبِّكَ قَبْلَ طُلُوعِ الشَّمْسِ وَقَبْلَ غُرُوبِهَا"</p>
        <div style="margin-top: 30px; font-size: 1.2rem;">
            ورد اليوم: (سورة البقرة - من الآية 1 إلى 50)
        </div>
        <a href="index.html" class="back-btn">العودة للرئيسية</a>
    </div>
</body>
</html>
