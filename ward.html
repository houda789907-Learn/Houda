<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الورد اليومي - المصحف الشريف</title>
    <style>
        :root {
            --gold: #d4af37;
            --black: #0a0a0a;
        }
        body { 
            background-color: var(--black); 
            color: var(--gold); 
            font-family: 'Segoe UI', sans-serif; 
            text-align: center; 
            margin: 0;
            padding: 10px;
        }
        .container { 
            max-width: 900px; 
            margin: auto; 
        }
        h1 { margin-bottom: 10px; font-size: 1.8rem; }
        
        /* إطار المصحف */
        .quran-frame {
            width: 100%;
            height: 70vh; /* يأخذ 70% من طول الشاشة */
            border: 2px solid var(--gold);
            border-radius: 10px;
            background: white; /* خلفية بيضاء لسهولة القراءة */
        }

        .back-btn { 
            display: inline-block; 
            margin: 15px 0; 
            color: var(--black); 
            background: var(--gold); 
            padding: 8px 25px; 
            text-decoration: none; 
            border-radius: 50px; 
            font-weight: bold; 
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>المصحف الشريف</h1>
        
        <iframe class="quran-frame" 
                src="https://quran.ksu.edu.sa/m.php?l=ar#aya=1_1" 
                title="القرآن الكريم">
        </iframe>

        <br>
        <a href="index.html" class="back-btn">العودة للرئيسية</a>
        
        <footer style="margin-top: 20px; font-size: 0.8rem; opacity: 0.6;">
            CEO-Co-Founder | Houda
        </footer>
    </div>
</body>
</html>
