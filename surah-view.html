<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المصحف الشريف | عرض الصفحات</title>
    <style>
        :root { --gold: #d4af37; --night: #020c1b; }
        
        body { 
            background: #fdf6e3; color: #222; font-family: 'Amiri', serif; 
            margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden;
        }
        
        header { 
            background: var(--night); color: var(--gold); 
            padding: 15px 10px; 
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 2px solid var(--gold);
            z-index: 101;
        }

        .nav-arrow {
            background: none; border: 1px solid var(--gold); color: var(--gold);
            font-size: 1.5rem; width: 40px; height: 40px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: 0.3s; padding: 0;
        }

        .nav-arrow:active { background: var(--gold); color: var(--night); }
        .nav-arrow:disabled { opacity: 0.2; cursor: not-allowed; }

        #page-title-info { text-align: center; }
        #page-title-info div:first-child { font-size: 1.1rem; font-weight: bold; }
        #page-title-info div:last-child { font-size: 0.8rem; opacity: 0.8; }

        #page-container {
            flex: 1; padding: 20px; overflow-y: auto;
            display: block; line-height: 2.5; text-align: justify;
            direction: rtl; font-size: 1.6rem;
            -webkit-overflow-scrolling: touch;
        }

        .ayah-num { 
            display: inline-flex; align-items: center; justify-content: center;
            width: 28px; height: 28px; border: 1px solid var(--gold); 
            border-radius: 50%; font-size: 0.9rem; margin: 0 8px; color: #d4af37;
            font-family: sans-serif; font-weight: bold;
        }

        .basmala { 
            display: block; text-align: center; font-size: 1.8rem; 
            color: #8a6d3b; margin: 15px 0; font-weight: bold; 
        }

        .surah-header {
            text-align: center; background: rgba(212, 175, 55, 0.05);
            border: 1px solid var(--gold); padding: 10px; margin: 25px 0;
            font-size: 1.8rem; color: var(--night); border-radius: 12px;
            font-weight: bold;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Amiri&display=swap" rel="stylesheet">
</head>
<body>

    <header>
        <button class="nav-arrow" id="prevBtn" onclick="changePage(-1)">➔</button>
        <div id="page-title-info">
            <div id="page-num-text">جاري التحميل...</div>
            <div id="juz-info">الجزء --</div>
        </div>
        <button class="nav-arrow" id="nextBtn" onclick="changePage(1)">⬅</button>
    </header>

    <div id="page-container"></div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const surahNo = parseInt(urlParams.get('no')) || 1;
        let currentPageNum = 1;

        fetch(`https://api.alquran.cloud/v1/surah/${surahNo}`)
            .then(res => res.json())
            .then(data => {
                currentPageNum = data.data.ayahs[0].page;
                loadQuranPage(currentPageNum);
            });

        function loadQuranPage(pageNum) {
            const container = document.getElementById('page-container');
            container.innerHTML = "<center style='margin-top:50px; color:var(--gold);'>جاري تحميل الصفحة...</center>";

            fetch(`https://api.alquran.cloud/v1/page/${pageNum}/quran-simple`)
                .then(res => res.json())
                .then(data => {
                    container.innerHTML = "";
                    const ayahs = data.data.ayahs;
                    let lastSurah = "";

                    ayahs.forEach(ayah => {
                        if (ayah.surah.name !== lastSurah) {
                            container.innerHTML += `<div class="surah-header">سورة ${ayah.surah.name}</div>`;
                            if (ayah.surah.number !== 1 && ayah.surah.number !== 9) {
                                container.innerHTML += `<div class="basmala">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>`;
                            }
                            lastSurah = ayah.surah.name;
                        }

                        let text = ayah.text;
                        
                        // تنظيف الآية الأولى من البسملة المدمجة (بكل أنواع التشكيل الممكنة)
                        if (ayah.numberInSurah === 1 && ayah.surah.number !== 1) {
                            const basmalaPatterns = [
                                /^بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ\s?/,
                                /^بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ\s?/,
                                /^بِسْمِ اللهِ الرَّحْمَنِ الرَّحِيمِ\s?/
                            ];
                            basmalaPatterns.forEach(pattern => {
                                text = text.replace(pattern, "");
                            });
                        }

                        container.innerHTML += `<span class="ayah">${text.trim()} <span class="ayah-num">${ayah.numberInSurah}</span></span> `;
                    });

                    document.getElementById('page-num-text').innerText = `صفحة ${pageNum}`;
                    document.getElementById('juz-info').innerText = `الجزء ${ayahs[0].juz}`;
                    document.getElementById('prevBtn').disabled = (pageNum <= 1);
                    document.getElementById('nextBtn').disabled = (pageNum >= 604);
                    container.scrollTop = 0;
                });
        }

        function changePage(step) {
            currentPageNum += step;
            if(currentPageNum >= 1 && currentPageNum <= 604) {
                loadQuranPage(currentPageNum);
            }
        }
    </script>
</body>
</html>
