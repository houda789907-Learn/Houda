<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المصحف الشريف | عرض الصفحات</title>
    <style>
        :root { --gold: #d4af37; --night: #020c1b; }
        
        body { 
            background: #fdf6e3; color: #222; font-family: 'Amiri', serif; 
            margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden;
        }
        
        header { 
            background: var(--night); color: var(--gold); padding: 12px; 
            text-align: center; font-size: 1.2rem; border-bottom: 2px solid var(--gold);
            z-index: 101;
        }

        #page-container {
            flex: 1; padding: 20px; overflow-y: auto;
            display: block; line-height: 2.2; text-align: justify;
            direction: rtl; font-size: 1.5rem;
            -webkit-overflow-scrolling: touch;
        }

        .ayah-num { 
            display: inline-flex; align-items: center; justify-content: center;
            width: 26px; height: 26px; border: 1px solid var(--gold); 
            border-radius: 50%; font-size: 0.8rem; margin: 0 5px; color: #888;
            font-family: sans-serif; font-weight: bold;
        }

        .basmala { 
            display: block; text-align: center; font-size: 1.8rem; 
            color: #8a6d3b; margin: 20px 0; font-weight: bold; 
        }

        .surah-header {
            text-align: center; background: rgba(212, 175, 55, 0.1);
            border: 1px solid var(--gold); padding: 10px; margin: 25px 0;
            font-size: 1.8rem; color: var(--night); border-radius: 12px;
            font-weight: bold;
        }

        /* الجزء المطلوب لرفع الزراير في الموبايل */
        .pagination { 
            background: var(--night); 
            padding: 20px 15px 45px 15px; /* رفعنا المسافة السفلية لـ 45px */
            display: flex; 
            justify-content: space-around; 
            align-items: center; 
            border-top: 1px solid var(--gold);
            position: relative;
            z-index: 100;
            box-shadow: 0 -5px 15px rgba(0,0,0,0.3);
        }

        .nav-btn {
            background: var(--gold); 
            color: var(--night); 
            border: none;
            padding: 12px 28px; 
            border-radius: 12px; 
            font-weight: bold; 
            cursor: pointer;
            font-size: 1.1rem;
            transition: 0.2s;
        }

        .nav-btn:active { transform: scale(0.9); }

        .nav-btn:disabled { opacity: 0.2; cursor: not-allowed; }

        #page-info { 
            color: white; 
            font-size: 1rem; 
            font-weight: bold;
            background: rgba(255, 255, 255, 0.1);
            padding: 6px 15px;
            border-radius: 20px;
            border: 1px solid rgba(212, 175, 55, 0.3);
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Amiri&display=swap" rel="stylesheet">
</head>
<body>

    <header id="current-info">جاري التحميل...</header>

    <div id="page-container">
        </div>

    <div class="pagination">
        <button class="nav-btn" id="nextBtn" onclick="changePage(1)">التالية</button>
        <span id="page-info">صفحة --</span>
        <button class="nav-btn" id="prevBtn" onclick="changePage(-1)">السابقة</button>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const surahNo = parseInt(urlParams.get('no')) || 1;
        let currentPageNum = 1;

        // البداية من أول صفحة للسورة المختارة
        fetch(`https://api.alquran.cloud/v1/surah/${surahNo}`)
            .then(res => res.json())
            .then(data => {
                currentPageNum = data.data.ayahs[0].page;
                loadQuranPage(currentPageNum);
            });

        function loadQuranPage(pageNum) {
            const container = document.getElementById('page-container');
            container.innerHTML = "<center style='margin-top:50px; color:var(--gold);'>جاري تحميل الصفحة...</center>";

            fetch(`https://api.alquran.cloud/v1/page/${pageNum}/quran-simple`)
                .then(res => res.json())
                .then(data => {
                    container.innerHTML = "";
                    const ayahs = data.data.ayahs;
                    let lastSurah = "";

                    ayahs.forEach(ayah => {
                        if (ayah.surah.name !== lastSurah) {
                            container.innerHTML += `<div class="surah-header">سورة ${ayah.surah.name}</div>`;
                            if (ayah.surah.number !== 1 && ayah.surah.number !== 9) {
                                container.innerHTML += `<div class="basmala">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>`;
                            }
                            lastSurah = ayah.surah.name;
                        }

                        let text = ayah.text;
                        if (ayah.numberInSurah === 1 && ayah.surah.number !== 1) {
                            text = text.replace("بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ", "");
                        }

                        container.innerHTML += `<span class="ayah">${text} <span class="ayah-num">${ayah.numberInSurah}</span></span> `;
                    });

                    document.getElementById('page-info').innerText = `صفحة ${pageNum}`;
                    document.getElementById('current-info').innerText = `الجزء ${ayahs[0].juz} - صفحة ${pageNum}`;
                    
                    document.getElementById('prevBtn').disabled = (pageNum <= 1);
                    document.getElementById('nextBtn').disabled = (pageNum >= 604);
                    container.scrollTop = 0;
                });
        }

        function changePage(step) {
            currentPageNum += step;
            if(currentPageNum >= 1 && currentPageNum <= 604) {
                loadQuranPage(currentPageNum);
            }
        }
    </script>
</body>
</html>
