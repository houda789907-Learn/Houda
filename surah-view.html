<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المصحف الشريف | عرض الصفحات</title>
    <style>
        :root { --gold: #d4af37; --night: #020c1b; }
        @font-face { font-family: 'QuranFont'; src: url('https://fonts.googleapis.com/css2?family=Amiri&display=swap'); }
        
        body { 
            background: #fdf6e3; color: #222; font-family: 'Amiri', serif; 
            margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden;
        }
        
        header { 
            background: var(--night); color: var(--gold); padding: 10px; 
            text-align: center; font-size: 1.2rem; border-bottom: 2px solid var(--gold);
        }

        #page-container {
            flex: 1; padding: 20px; overflow-y: auto;
            display: block; line-height: 2.2; text-align: justify;
            direction: rtl; font-size: 1.5rem;
        }

        .ayah-num { 
            display: inline-flex; align-items: center; justify-content: center;
            width: 25px; height: 25px; border: 1px solid var(--gold); 
            border-radius: 50%; font-size: 0.8rem; margin: 0 5px; color: #888;
            font-family: sans-serif;
        }

        .basmala { 
            display: block; text-align: center; font-size: 1.8rem; 
            color: #8a6d3b; margin: 20px 0; font-weight: bold; 
        }

        .surah-header {
            text-align: center; background: rgba(212, 175, 55, 0.1);
            border: 1px solid var(--gold); padding: 10px; margin: 20px 0;
            font-size: 1.8rem; color: var(--night); border-radius: 10px;
        }

        .pagination { 
            background: var(--night); padding: 15px; display: flex; 
            justify-content: space-around; align-items: center; 
        }

        .nav-btn {
            background: var(--gold); color: var(--night); border: none;
            padding: 8px 20px; border-radius: 8px; font-weight: bold; cursor: pointer;
        }

        .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        #page-info { color: white; font-size: 0.9rem; }
    </style>
</head>
<body>

    <header id="current-info">جاري التحميل...</header>

    <div id="page-container">
        </div>

    <div class="pagination">
        <button class="nav-btn" id="nextBtn" onclick="changePage(1)">التالية</button>
        <span id="page-info">صفحة --</span>
        <button class="nav-btn" id="prevBtn" onclick="changePage(-1)">السابقة</button>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const surahNo = parseInt(urlParams.get('no'));
        let currentPageNum = 1;

        // عند فتح السورة لأول مرة، نعرف هي بتبدأ في صفحة كام في المصحف
        fetch(`https://api.alquran.cloud/v1/surah/${surahNo}`)
            .then(res => res.json())
            .then(data => {
                currentPageNum = data.data.ayahs[0].page;
                loadQuranPage(currentPageNum);
            });

        function loadQuranPage(pageNum) {
            const container = document.getElementById('page-container');
            container.innerHTML = "<center>جاري تحميل الصفحة...</center>";

            // جلب بيانات الصفحة بالكامل من الـ API (كل آيات الصفحة الورقية)
            fetch(`https://api.alquran.cloud/v1/page/${pageNum}/quran-simple`)
                .then(res => res.json())
                .then(data => {
                    container.innerHTML = "";
                    const ayahs = data.data.ayahs;
                    let lastSurah = "";

                    ayahs.forEach(ayah => {
                        // لو الآية بداية سورة جديدة في نفس الصفحة، نحط عنوان السورة والبسملة
                        if (ayah.surah.name !== lastSurah) {
                            container.innerHTML += `<div class="surah-header">${ayah.surah.name}</div>`;
                            if (ayah.surah.number !== 1 && ayah.surah.number !== 9) {
                                container.innerHTML += `<div class="basmala">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>`;
                            }
                            lastSurah = ayah.surah.name;
                        }

                        let text = ayah.text;
                        // تنظيف نص البسملة لو مكرر في بداية السورة
                        if (ayah.numberInSurah === 1 && ayah.surah.number !== 1) {
                            text = text.replace("بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ", "");
                        }

                        container.innerHTML += `<span class="ayah">${text} <span class="ayah-num">${ayah.numberInSurah}</span></span> `;
                    });

                    document.getElementById('page-info').innerText = `صفحة رقم ${pageNum}`;
                    document.getElementById('current-info').innerText = `الجزء ${ayahs[0].juz}`;
                    
                    // تحديث الزراير (المصحف 604 صفحة)
                    document.getElementById('prevBtn').disabled = (pageNum <= 1);
                    document.getElementById('nextBtn').disabled = (pageNum >= 604);
                    container.scrollTop = 0;
                });
        }

        function changePage(step) {
            // لاحظ في المصحف الورقي السحب لليمين بيقدم الصفحة، هنا بنغير بالرقم
            currentPageNum += step;
            loadQuranPage(currentPageNum);
        }
    </script>
</body>
</html>
