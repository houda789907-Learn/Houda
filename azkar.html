<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الأذكار</title>
    <style>
        body { background-color: #0a0a0a; color: #d4af37; font-family: 'Segoe UI', sans-serif; text-align: center; padding: 20px; }
        .zekr-box { border: 1px solid #d4af37; margin: 15px auto; padding: 15px; max-width: 400px; border-radius: 10px; cursor: pointer; transition: 0.3s; }
        .zekr-box:active { transform: scale(0.95); background: #1a1a1a; }
        .counter { font-size: 2rem; display: block; margin-top: 10px; }
        .back-btn { display: inline-block; margin-top: 20px; color: #0a0a0a; background: #d4af37; padding: 10px 20px; text-decoration: none; border-radius: 5px; font-weight: bold; }
    </style>
</head>
<body>
    <h1>أذكار المسلم</h1>
    
    <div class="zekr-box" onclick="count(this)">
        <p>سُبْحَانَ اللَّهِ وَبِحَمْدِهِ</p>
        <span class="counter">0</span>
    </div>

    <div class="zekr-box" onclick="count(this)">
        <p>أستغفر الله وأتوب إليه</p>
        <span class="counter">0</span>
    </div>

    <a href="index.html" class="back-btn">العودة للرئيسية</a>

    <script>
        function count(element) {
            let counterSpan = element.querySelector('.counter');
            let current = parseInt(counterSpan.innerText);
            counterSpan.innerText = current + 1;
        }
    </script>
</body>
</html>
