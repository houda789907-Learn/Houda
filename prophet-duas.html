<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أدعية نبوية | Houda App</title>
    <style>
        :root { 
            --gold: #d4af37; 
            --deep-sky: #0a192f; 
            --night-blue: #020c1b;
            --white: #ffffff;
        }
        
        body { 
            background: radial-gradient(circle at center, var(--deep-sky) 0%, var(--night-blue) 100%); 
            color: var(--white); font-family: 'Segoe UI', sans-serif; 
            margin: 0; padding: 20px; min-height: 100vh;
            text-align: center;
        }

        header {
            position: sticky; top: 0; background: var(--night-blue);
            padding: 15px; z-index: 100; border-bottom: 2px solid var(--gold);
            margin-bottom: 25px; border-radius: 0 0 20px 20px;
        }

        h1 { color: var(--gold); margin: 0; font-size: 1.6rem; }

        .dua-container { max-width: 600px; margin: 0 auto; display: grid; gap: 20px; }

        .dua-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 15px;
            padding: 20px;
            text-align: right;
            transition: 0.3s;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .dua-card:active { transform: scale(0.97); background: rgba(212, 175, 55, 0.1); }

        .dua-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 12px; border-bottom: 1px solid rgba(212, 175, 55, 0.1);
            padding-bottom: 8px;
        }

        .dua-num { background: var(--gold); color: var(--night-blue); padding: 2px 10px; border-radius: 10px; font-weight: bold; font-size: 0.8rem; }
        .prophet-tag { color: var(--gold); font-size: 0.85rem; font-weight: bold; }

        .dua-text { font-size: 1.15rem; line-height: 1.8; color: var(--white); margin: 10px 0; }

        .hadith-ref {
            display: block; margin-top: 10px; font-size: 0.8rem;
            color: var(--gold); opacity: 0.7; text-align: left;
        }

        .back-btn {
            display: inline-block; margin: 30px 0; color: var(--gold);
            text-decoration: none; border: 1px solid var(--gold);
            padding: 12px 35px; border-radius: 30px; transition: 0.3s;
        }

        #stars-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; }
        .star { position: absolute; background: white; border-radius: 50%; animation: twinkle var(--duration) infinite; }
        @keyframes twinkle { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }

        #toast {
            visibility: hidden; min-width: 200px; background-color: var(--gold);
            color: var(--night-blue); text-align: center; border-radius: 50px;
            padding: 10px; position: fixed; z-index: 1000; bottom: 30px;
            left: 50%; transform: translateX(-50%); font-weight: bold;
        }
        #toast.show { visibility: visible; animation: fadeInOut 2s; }
    </style>
</head>
<body>

    <div id="stars-container"></div>
    
    <header>
        <h1>💬 50 دعاء من السنة النبوية</h1>
    </header>

    <div class="dua-container" id="dua-list">
        </div>

    <a href="index.html" class="back-btn">🏠 العودة للرئيسية</a>

    <div id="toast">تم النسخ ✅</div>

    <script>
        const prophetDuas = [
            { n: 1, t: "اللهم لك أسلمت، وبك آمنت، وعليك توكلت، وإليك خاصمت، وبك حاكمت، فاغفر لي ما قدمت وما أخرت، وأسررت وأعلنت، وما أنت أعلم به مني، لا إله إلا أنت", r: "متفق عليه" },
            { n: 2, t: "اللهم ربنا لك الحمد، ملء السماوات وملء الأرض، وملء ما شئت من شيء بعد أهل الثناء والمجد، لا مانع لما أعطيت، ولا معطي لما منعت ولا ينفع ذا الجد منك الجد", r: "أخرجه مسلم" },
            { n: 3, t: "سبحانك اللهم ربنا وبحمدك، اللهم اغفر لي", r: "متفق عليه" },
            { n: 4, t: "اللهم صل على محمد وعلى آل محمد، كما صليت على إبراهيم، وعلى آل إبراهيم، إنك حميد مجيد، اللهم بارك على محمد وعلى آل محمد، كما باركت على إبراهيم وعلى آل إبراهيم، إنك حميد مجيد", r: "متفق عليه" },
            { n: 5, t: "اللهم إني ظلمت نفسي ظلما كثيرا ولا يغفر الذنوب إلا أنت، فاغفر لي مغفرة من عندك وارحمني، إنك أنت الغفور الرحيم", r: "متفق عليه" },
            { n: 6, t: "اللهم إني أعوذ بك من العجز والكسل، والجبن والهرم والبخل ، وأعوذ بك من عذاب القبر ومن فتنة المحيا والممات", r: "متفق عليه" },
            { n: 7, t: "اللهم إني أعوذ بك من الهم والحزن، والعجز والكسل، والجبن والبخل، وضلع الدين، وغلبة الرجال", r: "أخرجه البخاري" },
            { n: 8, t: "اللهم إني أعوذ بك من العجز والكسل، والجبن والبخل، والهرم وعذاب القبر، اللهم آت نفسي تقواها، وزكها أنت خير من زكاها، أنت وليها ومولاها اللهم إني أعوذ بك من علم لا ينفع ومن قلب لا يخشع، ومن نفس لا تشبع، ومن دعوة لا يستجاب لها", r: "أخرجه مسلم" },
            { n: 9, t: "اللهم إني أعوذ بك من الكسل والهرم، والمغرم والمأثم، اللهم إني أعوذ بك من عذاب النار وفتنة النار، وفتنة القبر وعذاب القبر، وشر فتنة الغنى، وشر فتنة الفقر، ومن شر فتنة المسيح الدجال، اللهم اغسل خطاياي بماء الثلج والبرد، ونق قلبي من الخطايا، كما ينقى الثوب الأبيض من الدنس، وباعد بيني وبين خطاياي كما باعدت بين المشرق والمغرب", r: "متفق عليه" },
            { n: 10, t: "اللهم إني أعوذ بك من الجبن، وأعوذ بك من البخل، وأعوذ بك من أن أرد إلى أرذل العمر، وأعوذ بك من فتنة الدنيا، وعذاب القبر", r: "أخرجه البخاري" },
            { n: 11, t: "اللهم إني أعوذ بك من شر ما عملت، ومن شر ما لم أعمل", r: "أخرجه مسلم" },
            { n: 12, t: "اللهم إني أعوذ بك من فتنة النار ومن عذاب النار، وأعوذ بك من فتنة القبر، وأعوذ بك من عذاب القبر، وأعوذ بك من فتنة الغنى، وأعوذ بك من فتنة الفقر، وأعوذ بك من فتنة المسيح الدجال", r: "متفق عليه" },
            { n: 13, t: "اللهم إني أعوذ بك من زوال نعمتك، وتحول عافيتك وفجاءة نقمتك، وجميع سخطك", r: "أخرجه مسلم" },
            { n: 14, t: "اللهم إني أعوذ بك من البرص والجنون والجذام ومن سيئ الأسقام", r: "أخرجه أبو داود والنسائي" },
            { n: 15, t: "اللهم إني أعوذ بك من منكرات الأخلاق والأعمال والأهواء", r: "أخرجه الترمذي" },
            { n: 16, t: "اللهم إني أعوذ بك من شر سمعي ومن شر بصري ومن شر لساني ومن شر قلبي ومن شر منيي", r: "أخرجه الترمذي والنسائي" },
            { n: 17, t: "اللهم إني أعوذ بك من الفقر والقلة والذلة وأعوذ بك من أن أظلم أو أظلم", r: "أخرجه أبو داود والنسائي" },
            { n: 18, t: "اللهم إني أعوذ بعظمتك أن أغتال من تحتي", r: "أخرجه أبو داود والنسائي" },
            { n: 19, t: "اللهم إني أعوذ بك من الهدم وأعوذ بك من التردي وأعوذ بك من الغرق والحرق والهرم وأعوذ بك أن يتخبطني الشيطان عند الموت وأعوذ بك أن أموت في سبيلك مدبرا وأعوذ بك أن أموت لديغا", r: "أخرجه أبو داود والنسائي" },
            { n: 20, t: "اللهم إني أسألك من الخير كله عاجله وآجله ما علمت منه وما لم أعلم وأعوذ بك من الشر كله عاجله وآجله ما علمت منه وما لم أعلم اللهم إني أسألك من خير ما سألك عبدك ونبيك وأعوذ بك من شر ما عاذ به عبدك ونبيك اللهم إني أسألك الجنة وما قرب إليها من قول أو عمل وأعوذ بك من النار وما قرب إليها من قول أو عمل وأسألك أن تجعل كل قضاء قضيته لي خيرا", r: "أخرجه أحمد وابن ماجه" },
            { n: 21, t: "اللهم إني أسألك يا الله بأنك الواحد الأحد الصمد الذي لم يلد ولم يولد ولم يكن له كفوا أحد أن تغفر لي ذنوبي إنك أنت الغفور الرحيم", r: "أخرجه أبو داود والنسائي" },
            { n: 22, t: "اللهم إني أسألك بأن لك الحمد لا إله إلا أنت المنان بديع السماوات والأرض يا ذا الجلال والإكرام يا حي يا قيوم إني أسألك", r: "أخرجه أبو داود والنسائي" },
            { n: 23, t: "اللهم إني أسألك بأني أشهد أنك أنت الله لا إله إلا أنت الأحد الصمد الذي لم يلد ولم يولد ولم يكن له كفوا أحد", r: "أخرجه الترمذي وابن ماجه" },
            { n: 24, t: "اللهم إني أسألك فعل الخيرات وترك المنكرات وحب المساكين وإذا أردت بعبادك فتنة فاقبضني إليك غير مفتون", r: "أخرجه الترمذي" },
            { n: 25, t: "اللهم إني أسألك الهدى والتقى والعفاف والغنى", r: "أخرجه مسلم" },
            { n: 26, t: "اللهم أعني على ذكرك وشكرك وحسن عبادتك", r: "أخرجه البخاري وأبو داود" },
            { n: 27, t: "اللهم اجعل في قلبي نورا، وفي بصري نورا، وفي سمعي نورا، وعن يميني نورا، وعن يساري نورا، وفوقي نورا، وتحتي نورا، وأمامي نورا، وخلفي نورا، وعظم لي نورا", r: "أخرجه مسلم" },
            { n: 28, t: "اللهم أصلح لي ديني الذي هو عصمة أمري، وأصلح لي دنياي التي فيها معاشي، وأصلح لي آخرتي التي فيها معادي، واجعل الحياة زيادة لي في كل خير، واجعل الموت راحة لي من كل شر", r: "أخرجه مسلم" },
            { n: 29, t: "اللهم اغفر لي خطيئتي، وجهلي وإسرافي، في أمري وما أنت أعلم به مني، اللهم اغفر لي جدي وهزلي وخطئي وعمدي وكل ذلك عندي، اللهم اغفر لي ما قدمت وما أخرت وما أسررت وما أعلنت وما أنت أعلم به مني أنت المقدم وأنت المؤخر، وأنت على كل شيء قدير", r: "متفق عليه" },
            { n: 30, t: "اللهم حبب إلينا الإيمان وزينه في قلوبنا، وكره إلينا الكفر والفسوق والعصيان، واجعلنا من الراشدين، اللهم توفنا مسلمين وأحينا مسلمين وألحقنا بالصالحين غير خزايا ولا مفتونين", r: "أخرجه أحمد والبخاري" },
            { n: 31, t: "اللهم اغفر لي وارحمني واهدني وارزقني", r: "أخرجه مسلم" },
            { n: 32, t: "اللهم اغفر لي ذنبي كله، دقه وجله، وأوله وآخره، وعلانيته وسره", r: "أخرجه مسلم" },
            { n: 33, t: "اللهم اغفر لي ما قدمت وما أخرت، وما أسررت وما أعلنت، وما أسرفت، وما أنت أعلم به مني، أنت المقدم وأنت المؤخر، لا إله إلا أنت", r: "أخرجه مسلم" },
            { n: 34, t: "اللهم أنت ربي لا إله إلا أنت، خلقتني وأنا عبدك، وأنا على عهدك ووعدك ما استطعت، أعوذ بك من شر ما صنعت، أبوء لك بنعمتك علي وأبوء لك بذنبي فاغفر لي، فإنه لا يغفر الذنوب إلا أنت", r: "أخرجه البخاري (سيد الاستغفار)" },
            { n: 35, t: "اللهم اهدني فيمن هديت، وعافني فيمن عافيت، وتولني فيمن توليت، وبارك لي فيما أعطيت وقني شر ما قضيت، إنك تقضي ولا يقضى عليك، وإنه لا يذل من واليت ولا يعز من عاديت تباركت ربنا وتعاليت", r: "أخرجه أبو داود والترمذي" },
            { n: 36, t: "اللهم اهدني وسددني", r: "أخرجه مسلم" },
            { n: 37, t: "اللهم لك أسلمت، وبك آمنت، وعليك توكلت، وإليك أنبت وبك خاصمت اللهم إني أعوذ بعزتك لا إله إلا أنت أن تضلني، أنت الحي الذي لا يموت، والجن والإنس يموتون", r: "متفق عليه" },
            { n: 38, t: "اللهم ربنا آتنا في الدنيا حسنة، وفي الآخرة حسنة، وقنا عذاب النار", r: "متفق عليه" },
            { n: 39, t: "اللهم مصرف القلوب صرف قلوبنا على طاعتك", r: "أخرجه مسلم" },
            { n: 40, t: "يا مقلب القلوب ثبت قلبي على دينك", r: "أخرجه أحمد والترمذي" },
            { n: 41, t: "اللهم إني عبدك، وابن عبدك، وابن أمتك، ناصيتي بيدك، ماض في حكمك، عدل في قضاؤك، أسألك بكل اسم هو لك سميت به نفسك، أو أنزلته في كتابك، أو علمته أحدا من خلقك، أو استأثرت به في علم الغيب عندك، أن تجعل القرآن ربيع قلبي، ونور صدري، وجلاء حزني، وذهاب همي", r: "أخرجه أحمد" },
            { n: 42, t: "اللهم بعلمك الغيب وقدرتك على الخلق أحيني ما علمت الحياة خيرا لي وتوفني إذا علمت الوفاة خيرا لي اللهم وأسألك خشيتك في الغيب والشهادة وأسألك كلمة الحق في الرضا والغضب وأسألك القصد في الفقر والغنى وأسألك نعيما لا ينفد وأسألك قرة عين لا تنقطع وأسألك الرضاء بعد القضاء وأسألك برد العيش بعد الموت وأسألك لذة النظر إلى وجهك والشوق إلى لقائك في غير ضراء مضرة ولا فتنة مضلة اللهم زينا بزينة الإيمان واجعلنا هداة مهتدين", r: "أخرجه النسائي" },
            { n: 43, t: "اللهم إنك عفو كريم تحب العفو فاعف عني", r: "أخرجه الترمذي" },
            { n: 44, t: "اللهم رب جبرائيل وميكائيل وإسرافيل، فاطر السماوات والأرض، عالم الغيب والشهادة، أنت تحكم بين عبادك فيما كانوا فيه يختلفون، اهدني لما اختلف فيه من الحق بإذنك إنك تهدي من تشاء إلى صراط مستقيم", r: "أخرجه مسلم" },
            { n: 45, t: "اللهم أحسنت خلقي فأحسن خلقي", r: "أخرجه أحمد" },
            { n: 46, t: "رب اغفر لي وتب علي إنك أنت التواب الغفور", r: "أخرجه أحمد والترمذي" },
            { n: 47, t: "اللهم أعوذ برضاك من سخطك، وبمعافاتك من عقوبتك، وأعوذ بك منك، لا أحصي ثناء عليك، أنت كما أثنيت على نفسك", r: "أخرجه مسلم" },
            { n: 48, t: "لا إله إلا أنت، سبحانك إني كنت من الظالمين", r: "رواه أحمد (دعوة ذي النون)" },
            { n: 49, t: "اللهم ضع في أرضنا بركتها وزينتها وسكنها", r: "رواه الطبراني" },
            { n: 50, t: "رب أعني، ولا تعن علي، وانصرني ولا تنصر علي، وامكر لي ولا تمكر علي، واهدني ويسر الهدى لي، وانصرني على من بغى علي، رب اجعلني لك شاكراً، لك ذاكراً، لك راهباً، لك مطواعاً، لك مخبتاً، إليك أواهاً منيباً، رب تقبل توبتي، واغسل حوبتي، وأجب دعواتي، وثبت حجتي، وسدد لساني، واهد قلبي، واسلل سخيمة صدري", r: "رواه أبو داود" }
        ];

        const list = document.getElementById('dua-list');
        prophetDuas.forEach(dua => {
            const card = document.createElement('div');
            card.className = 'dua-card';
            card.onclick = () => copyText(dua.t);
            card.innerHTML = `
                <div class="dua-header">
                    <span class="prophet-tag">قال ﷺ:</span>
                    <span class="dua-num">#${dua.n}</span>
                </div>
                <p class="dua-text">${dua.t}</p>
                <span class="hadith-ref">${dua.r}</span>
            `;
            list.appendChild(card);
        });

        function copyText(text) {
            navigator.clipboard.writeText(text).then(() => {
                const toast = document.getElementById("toast");
                toast.className = "show";
                setTimeout(() => { toast.className = ""; }, 2000);
                if (navigator.vibrate) navigator.vibrate(50);
            });
        }

        const container = document.getElementById('stars-container');
        for (let i = 0; i < 50; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            star.style.width = Math.random() * 2 + 'px';
            star.style.height = star.style.width;
            star.style.top = Math.random() * 100 + '%';
            star.style.left = Math.random() * 100 + '%';
            star.style.setProperty('--duration', (Math.random() * 3 + 2) + 's');
            container.appendChild(star);
        }
    </script>
</body>
</html>
