<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<script>
  // تسجيل المحرك (Service Worker)
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js')
        .then(reg => console.log('Houda App Registered!'))
        .catch(err => console.log('Registration failed', err));
    });
  }
</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Houda Edition | أذكار الصباح والمساء</title>
    <style>
        :root { 
            --gold: #d4af37; 
            --deep-sky: #0a192f; 
            --night-blue: #020c1b;
            --white: #ffffff;
        }
        
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background: radial-gradient(circle at center, var(--deep-sky) 0%, var(--night-blue) 100%); 
            color: var(--white);
            font-family: 'Segoe UI', sans-serif; overflow: hidden;
        }

        /* النجوم المتلألئة */
        #stars-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0; pointer-events: none;
        }
        .star {
            position: absolute; background: white; border-radius: 50%;
            opacity: 0.5; animation: twinkle var(--duration) infinite ease-in-out;
        }

        /* الأدعية العائمة (المخصصة التي طلبتها) */
        .floating-dua {
            position: fixed; bottom: -80px; 
            color: rgba(255, 255, 255, 0.9);
            font-size: 1.1rem; font-weight: bold;
            text-shadow: 0 0 10px rgba(255,255,255,0.4);
            pointer-events: none; 
            animation: floatUp 15s linear infinite;
            z-index: 5; text-align: center; width: 100%;
        }

        #app {
            display: flex; flex-direction: column; height: 100vh;
            justify-content: space-between; align-items: center; padding: 40px 20px;
            box-sizing: border-box; text-align: center;
            position: relative; z-index: 10;
        }

        /* الدوائر: أذكار الصباح وأذكار المساء */
        .nav-circles { display: flex; gap: 20px; }
        .nav-circles a {
            width: 100px; height: 100px; 
            border: 1.5px solid var(--gold);
            background: rgba(212, 175, 55, 0.05);
            border-radius: 50%; display: flex; justify-content: center;
            align-items: center; text-decoration: none; color: var(--gold);
            font-weight: bold; transition: 0.3s; text-align: center; font-size: 0.9rem;
            backdrop-filter: blur(2px);
        }
        .nav-circles a:hover { background: var(--gold); color: var(--night-blue); }

        .emo-btn {
            background: rgba(255,255,255,0.1); border: 1px solid var(--gold); 
            color: var(--gold); padding: 8px 18px; border-radius: 20px; 
            cursor: pointer; font-weight: bold; margin: 5px;
        }

        #ayah-display { margin-top: 25px; color: var(--gold); font-weight: bold; font-size: 1.2rem; min-height: 40px; }

        footer { text-align: center; width: 100%; padding-bottom: 20px; }
        .ceo-sign { font-size: 0.65rem; letter-spacing: 4px; color: var(--gold); opacity: 0.8; }
        .ceo-name { font-size: 1.8rem; font-family: 'Times New Roman', serif; font-weight: bold; color: var(--gold); }

        @keyframes floatUp {
            from { transform: translateY(0) scale(0.8); opacity: 0; }
            15% { opacity: 1; }
            85% { opacity: 1; }
            to { transform: translateY(-115vh) scale(1.2); opacity: 0; }
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.3); }
        }
    </style>
</head>
<body>

    <div id="stars-container"></div>

    <div id="app">
        <div class="nav-circles">
            <a href="morning_azkar.html">أذكار<br>الصباح</a>
            <a href="evening_azkar.html">أذكار<br>المساء</a>
        </div>

        <div class="main-content">
            <h1 style="font-size: 2.2rem; color: var(--gold); text-shadow: 0 0 10px rgba(212,175,55,0.3);">رمضان كريم</h1>
            <p style="opacity: 0.8;">2 رمضان 1447 هـ</p>
            
            <div class="emotions-bar">
                <button class="emo-btn" onclick="feel('sad')">قلق</button>
                <button class="emo-btn" onclick="feel('tired')">متعب</button>
                <button class="emo-btn" onclick="feel('happy')">فرحان</button>
            </div>
            <div id="ayah-display"></div>
        </div>

        <footer>
            <div class="ceo-sign">CEO-CO-FOUNDER</div>
            <span class="ceo-name">Houda</span>
        </footer>
    </div>

    <script>
        // توليد النجوم
        const starsContainer = document.getElementById('stars-container');
        for (let i = 0; i < 100; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            const size = Math.random() * 2.5 + 'px';
            star.style.width = size;
            star.style.height = size;
            star.style.top = Math.random() * 100 + '%';
            star.style.left = Math.random() * 100 + '%';
            star.style.setProperty('--duration', (Math.random() * 3 + 2) + 's');
            starsContainer.appendChild(star);
        }

        // الأدعية المخصصة التي طلبتها
        const customDuas = [
            "اللهم صلِّ على محمد",
            "سبحان الله وبحمده",
            "سبحان الله العظيم",
            "أستغفر الله العظيم وأتوب إليه",
            "لا إله إلا الله وحده لا شريك له له الملك وله الحمد وهو على كل شيء قدير"
        ];

        function createFloatingDua() {
            const div = document.createElement('div');
            div.className = 'floating-dua';
            div.innerText = customDuas[Math.floor(Math.random() * customDuas.length)];
            // توزيع عشوائي لليسار واليمين مع الحفاظ على النص في المنتصف تقريباً
            div.style.left = Math.random() * 40 + 5 + "%";
            div.style.width = "90%"; 
            document.body.appendChild(div);
            setTimeout(() => div.remove(), 15000);
        }
        
        // إظهار دعاء كل 4 ثواني
        setInterval(createFloatingDua, 4500);

        function feel(type) {
            const display = document.getElementById('ayah-display');
            const responses = {
                sad: "﴿أَلَا بِذِكْرِ اللَّهِ تَطْمَئِنُّ الْقُلُوبُ﴾",
                tired: "﴿إِنَّ مَعَ الْعُسْرِ يُسْرًا﴾",
                happy: "﴿وَلَسَوْفَ يُعْطِيكَ رَبُّكَ فَتَرْضَىٰ﴾"
            };
            display.innerText = responses[type];
        }
    </script>
</body>
</html>
