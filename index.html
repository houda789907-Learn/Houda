<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رمضان كريم 2026</title>
    <style>
        :root {
            --gold: #d4af37;
            --black: #0a0a0a;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--black);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        /* --- شاشة الترحيب --- */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--black);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.8s ease;
        }

        .pentagon-container {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .pentagon {
            position: absolute;
            width: 250px;
            height: 250px;
            background: var(--gold);
            clip-path: polygon(50% 0%, 100% 38%, 82% 100%, 18% 100%, 0% 38%);
            opacity: 0.4;
            animation: pulse 2s infinite;
        }

        .pentagon-2 {
            transform: rotate(180deg);
            background: #b8860b;
        }

        .welcome-text {
            position: relative;
            color: var(--gold);
            font-size: 2.5rem;
            font-weight: bold;
            z-index: 10;
            text-shadow: 0 0 15px rgba(212, 175, 55, 0.6);
        }

        /* --- الصفحة الرئيسية --- */
        #main-content {
            display: none;
            padding: 20px;
            text-align: center;
            animation: fadeIn 1.2s;
        }

        .header-circles {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin-top: 50px;
        }

        .circle {
            width: 120px;
            height: 120px;
            border: 2px solid var(--gold);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--gold);
            text-decoration: none;
            font-weight: bold;
            transition: 0.4s;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.2);
        }

        .circle:hover {
            background-color: var(--gold);
            color: var(--black);
            box-shadow: 0 0 20px var(--gold);
        }

        /* --- عرض حالة الشهر --- */
        .status-container {
            margin-top: 80px;
            color: var(--gold);
        }

        .ramadan-title {
            font-size: 2.2rem;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        .day-counter {
            font-size: 1.4rem;
            border: 1px solid var(--gold);
            display: inline-block;
            padding: 10px 30px;
            border-radius: 50px;
            margin-top: 20px;
        }

        /* --- الأنميشن --- */
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.3; }
            50% { transform: scale(1.1); opacity: 0.5; }
        }
        @keyframes fadeIn {
            from { opacity: 0; } to { opacity: 1; }
        }
    </style>
</head>
<body>

    <div id="splash-screen">
        <div class="pentagon-container">
            <div class="pentagon"></div>
            <div class="pentagon pentagon-2"></div>
            <div class="welcome-text">أهلاً رمضان</div>
        </div>
    </div>

    <div id="main-content">
        <div class="header-circles">
            <a href="ward.html" class="circle">الورد اليومي</a>
            <a href="azkar.html" class="circle">الأذكار</a>
        </div>

        <div class="status-container">
            <div class="ramadan-title">رمضان كريم</div>
            <div class="day-counter" id="today-info">
                جمعة مباركة | 3 رمضان 1447 هـ
            </div>
            <p style="color: #888; margin-top: 40px; font-style: italic;">
                "اللهم أعنا على صيامه وقيامه"
            </p>
        </div>
    </div>

    <script>
        // إخفاء الترحيب وإظهار المحتوى
        setTimeout(function() {
            const splash = document.getElementById('splash-screen');
            const main = document.getElementById('main-content');
            
            splash.style.opacity = '0';
            setTimeout(() => {
                splash.style.display = 'none';
                main.style.display = 'block';
            }, 800);
        }, 2000);

        // تحديث التاريخ بناءً على تاريخ اليوم 20 فبراير 2026
        // بما أن 18 فبراير كان أول رمضان، فاليوم هو 3 رمضان تقريباً
        const today = new Date();
        if(today.getDate() == 20 && (today.getMonth()+1) == 2) {
             document.getElementById("today-info").innerHTML = "اليوم: الجمعة | 3 رمضان 1447 هـ";
        }
    </script>
</body>
</html>
