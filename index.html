<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق حوده | أذكار الصباح والمساء</title>
    <meta name="description" content="تطبيق حوده للأذكار اليومية، أذكار الصباح والمساء بدون إنترنت، نسخة رمضان كريم 1447 هـ.">
    
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" href="icon.png" type="image/png">
    <link rel="apple-touch-icon" href="icon.png">

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('sw.js')
            .then(reg => console.log('Houda App Updated!'))
            .catch(err => console.log('Error', err));
        });
      }
    </script>

    <style>
        :root { 
            --gold: #d4af37; 
            --deep-sky: #0a192f; 
            --night-blue: #020c1b;
            --white: #ffffff;
        }
        
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background: radial-gradient(circle at center, var(--deep-sky) 0%, var(--night-blue) 100%); 
            color: var(--white); font-family: 'Segoe UI', sans-serif; overflow: hidden;
        }

        /* زرار الـ 3 شرط - تأكدت إنه يظهر فوق أي حاجة */
        .menu-btn {
            position: fixed; top: 20px; right: 20px;
            font-size: 2rem; color: var(--gold);
            cursor: pointer; z-index: 9999; /* رقم عالي جدا عشان ما يختفيش */
            background: rgba(10, 25, 47, 0.9);
            padding: 5px 15px; border-radius: 12px;
            border: 2px solid var(--gold);
            line-height: 1;
        }

        /* القائمة الجانبية */
        .side-menu {
            position: fixed; top: 0; right: -280px;
            width: 260px; height: 100%;
            background: var(--night-blue);
            border-left: 3px solid var(--gold);
            z-index: 10000; transition: 0.4s ease-in-out;
            padding-top: 80px; display: flex; flex-direction: column;
        }
        .side-menu.open { right: 0; }
        .side-menu a {
            color: var(--white); text-decoration: none;
            padding: 18px 25px; border-bottom: 1px solid rgba(212, 175, 55, 0.1);
            font-size: 1.2rem; transition: 0.3s; text-align: right;
        }
        .side-menu a:hover { background: var(--gold); color: var(--night-blue); }

        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); display: none; z-index: 9998;
        }

        /* باقي استايل النجوم والأبلكيشن */
        #stars-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; }
        .star { position: absolute; background: white; border-radius: 50%; opacity: 0.5; animation: twinkle var(--duration) infinite ease-in-out; }
        
        #app { display: flex; flex-direction: column; height: 100vh; justify-content: space-between; align-items: center; padding: 60px 20px; box-sizing: border-box; position: relative; z-index: 10; }
        
        .nav-circles { display: flex; gap: 20px; }
        .nav-circles a { width: 90px; height: 90px; border: 1.5px solid var(--gold); border-radius: 50%; display: flex; justify-content: center; align-items: center; text-decoration: none; color: var(--gold); font-weight: bold; font-size: 0.8rem; text-align: center; }
        
        .floating-dua { position: fixed; bottom: -80px; color: white; font-size: 1.1rem; font-weight: bold; animation: floatUp 15s linear infinite; z-index: 5; text-align: center; width: 100%; }

        @keyframes floatUp { from { transform: translateY(0); opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } to { transform: translateY(-110vh); opacity: 0; } }
        @keyframes twinkle { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
        
        .emo-btn { background: rgba(255,255,255,0.1); border: 1px solid var(--gold); color: var(--gold); padding: 8px 15px; border-radius: 20px; cursor: pointer; margin: 5px; }
        #ayah-display { margin-top: 20px; color: var(--gold); font-weight: bold; }
        .ceo-name { font-size: 1.5rem; color: var(--gold); font-family: serif; }
    </style>
</head>
<body>

    <div id="stars-container"></div>

    <div class="menu-btn" onclick="toggleMenu()">☰</div>

    <div class="side-menu" id="sideMenu">
        <a href="index.html">🏠 الرئيسية</a>
        <a href="morning_azkar.html">☀️ أذكار الصباح</a>
        <a href="evening_azkar.html">🌙 أذكار المساء</a>
        <a href="istikhara.html">💍 دعاء الاستخارة</a>
        <a href="travel.html">✈️ دعاء السفر</a>
        <a href="prayer_azkar.html">📿 أذكار الصلاة</a>
    </div>

    <div class="overlay" id="overlay" onclick="toggleMenu()"></div>

    <div id="app">
        <div class="nav-circles">
            <a href="morning_azkar.html">أذكار<br>الصباح</a>
            <a href="evening_azkar.html">أذكار<br>المساء</a>
        </div>

        <div class="main-content">
            <h1 style="color: var(--gold);">رمضان كريم</h1>
            <div class="emotions-bar">
                <button class="emo-btn" onclick="feel('sad')">قلق</button>
                <button class="emo-btn" onclick="feel('tired')">متعب</button>
                <button class="emo-btn" onclick="feel('happy')">فرحان</button>
            </div>
            <div id="ayah-display"></div>
        </div>

        <footer>
            <div style="font-size: 0.7rem; color: var(--gold);">CEO-CO-FOUNDER</div>
            <div class="ceo-name">Houda</div>
        </footer>
    </div>

    <script>
        function toggleMenu() {
            const menu = document.getElementById('sideMenu');
            const overlay = document.getElementById('overlay');
            menu.classList.toggle('open');
            overlay.style.display = menu.classList.contains('open') ? 'block' : 'none';
        }

        // نجوم
        const starsContainer = document.getElementById('stars-container');
        for (let i = 0; i < 80; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            star.style.width = Math.random() * 3 + 'px';
            star.style.height = star.style.width;
            star.style.top = Math.random() * 100 + '%';
            star.style.left = Math.random() * 100 + '%';
            star.style.setProperty('--duration', (Math.random() * 3 + 2) + 's');
            starsContainer.appendChild(star);
        }

        // أدعية
        const customDuas = ["اللهم صلِّ على محمد", "سبحان الله وبحمده", "أستغفر الله", "لا إله إلا الله"];
        function createFloatingDua() {
            const div = document.createElement('div');
            div.className = 'floating-dua';
            div.innerText = customDuas[Math.floor(Math.random() * customDuas.length)];
            div.style.left = Math.random() * 30 + 10 + "%";
            document.body.appendChild(div);
            setTimeout(() => div.remove(), 15000);
        }
        setInterval(createFloatingDua, 5000);

        function feel(type) {
            const display = document.getElementById('ayah-display');
            const responses = {
                sad: "﴿أَلَا بِذِكْرِ اللَّهِ تَطْمَئِنُّ الْقُلُوبُ﴾",
                tired: "﴿إِنَّ مَعَ الْعُسْرِ يُسْرًا﴾",
                happy: "﴿وَلَسَوْفَ يُعْطِيكَ رَبُّكَ فَتَرْضَىٰ﴾"
            };
            display.innerText = responses[type];
        }
    </script>
</body>
</html>
