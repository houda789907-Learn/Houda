<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رمضان كريم | 2026</title>
    <style>
        :root {
            --gold: #d4af37;
            --black: #0a0a0a;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--black);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--gold);
            overflow: hidden;
        }

        /* --- شاشة الترحيب --- */
        #splash-screen {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: var(--black);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.8s ease;
        }

        .pentagon-container {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .pentagon {
            position: absolute;
            width: 250px;
            height: 250px;
            background: var(--gold);
            clip-path: polygon(50% 0%, 100% 38%, 82% 100%, 18% 100%, 0% 38%);
            opacity: 0.4;
            animation: pulse 2s infinite;
        }

        .pentagon-2 { transform: rotate(180deg); background: #b8860b; }

        .welcome-text {
            position: relative;
            font-size: 2.5rem;
            font-weight: bold;
            z-index: 10;
            text-shadow: 0 0 15px rgba(212, 175, 55, 0.6);
        }

        /* --- المحتوى الرئيسي --- */
        #main-content {
            display: none;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 40px 20px;
            box-sizing: border-box;
            animation: fadeIn 1.2s;
        }

        .header-circles {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin-top: 20px;
        }

        .circle {
            width: 110px;
            height: 110px;
            border: 2px solid var(--gold);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--gold);
            text-decoration: none;
            font-weight: bold;
            transition: 0.4s;
        }

        .circle:hover {
            background-color: var(--gold);
            color: var(--black);
        }

        .status-container {
            text-align: center;
        }

        .ramadan-title { font-size: 2.5rem; margin-bottom: 10px; }

        .day-counter {
            border: 1px solid var(--gold);
            padding: 10px 25px;
            border-radius: 50px;
            font-size: 1.2rem;
        }

        /* --- التوقيع (Footer) --- */
        footer {
            text-align: center;
            margin-bottom: 20px;
        }

        .ceo-text {
            font-size: 0.8rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            opacity: 0.8;
        }

        .name-text {
            font-size: 1.8rem;
            font-family: 'Times New Roman', serif; /* خط كلاسيكي فخم */
            font-weight: bold;
            margin-top: 5px;
            display: block;
        }

        /* --- الأنميشن --- */
        @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 0.3; } 50% { transform: scale(1.1); opacity: 0.5; } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <div id="splash-screen">
        <div class="pentagon-container">
            <div class="pentagon"></div>
            <div class="pentagon pentagon-2"></div>
            <div class="welcome-text">أهلاً رمضان</div>
        </div>
    </div>

    <div id="main-content" style="display:none;">
        <div class="header-circles">
            <a href="ward.html" class="circle">الورد اليومي</a>
            <a href="azkar.html" class="circle">الأذكار</a>
        </div>

        <div class="status-container">
            <div class="ramadan-title">رمضان كريم</div>
            <div class="day-counter">2 رمضان 1447 هـ</div>
        </div>

        <footer>
            <div class="ceo-text">CEO-Co-Founder</div>
            <div class="name-text">Houda</div>
        </footer>
    </div>

    <script>
        setTimeout(function() {
            document.getElementById('splash-screen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('splash-screen').style.display = 'none';
                document.getElementById('main-content').style.display = 'flex';
            }, 800);
        }, 2000);
    </script>
</body>
</html>
