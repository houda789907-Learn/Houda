<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق حوده | أذكار الصباح والمساء</title>
    <meta name="description" content="تطبيق حوده للأذكار اليومية، أذكار الصباح والمساء بدون إنترنت، نسخة رمضان كريم 1447 هـ.">
    <meta name="keywords" content="أذكار، حوده، رمضان، أذكار الصباح، أذكار المساء، تطبيق إسلامي">

    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="icon" href="icon.png" type="image/png">

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('sw.js')
            .then(reg => console.log('Houda App Registered!'))
            .catch(err => console.log('Registration failed', err));
        });
      }
    </script>

    <style>
        :root { 
            --gold: #d4af37; 
            --deep-sky: #0a192f; 
            --night-blue: #020c1b;
            --white: #ffffff;
        }
        
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background: radial-gradient(circle at center, var(--deep-sky) 0%, var(--night-blue) 100%); 
            color: var(--white);
            font-family: 'Segoe UI', sans-serif; overflow: hidden;
        }

        /* زرار الـ 3 شرط */
        .menu-btn {
            position: fixed; top: 20px; right: 20px;
            font-size: 1.8rem; color: var(--gold);
            cursor: pointer; z-index: 1100;
            background: rgba(10, 25, 47, 0.8);
            padding: 5px 12px; border-radius: 10px;
            border: 1px solid var(--gold);
        }

        /* القائمة الجانبية */
        .side-menu {
            position: fixed; top: 0; right: -280px;
            width: 260px; height: 100%;
            background: var(--night-blue);
            border-left: 2px solid var(--gold);
            z-index: 1050; transition: 0.4s;
            padding-top: 80px; display: flex; flex-direction: column;
        }
        .side-menu.open { right: 0; }
        .side-menu a {
            color: var(--white); text-decoration: none;
            padding: 15px 25px; border-bottom: 1px solid rgba(212, 175, 55, 0.1);
            font-size: 1.1rem; transition: 0.3s; text-align: right;
        }
        .side-menu a:hover { background: rgba(212, 175, 55, 0.1); color: var(--gold); }

        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); display: none; z-index: 1040;
        }

        #stars-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
        .star { position: absolute; background: white; border-radius: 50%; opacity: 0.5; animation: twinkle var(--duration) infinite ease-in-out; }

        .floating-dua {
            position: fixed; bottom: -80px; 
            color: rgba(255, 255, 255, 0.9);
            font-size: 1.1rem; font-weight: bold;
            text-shadow: 0 0 10px rgba(255,255,255,0.4);
            pointer-events: none; 
            animation: floatUp 15s linear infinite;
            z-index: 5; text-align: center; width: 100%;
        }

        #app {
            display: flex; flex-direction: column; height: 100vh;
            justify-content: space-between; align-items: center; padding: 40px 20px;
            box-sizing: border-box; text-align: center;
            position: relative; z-index: 10;
        }

        .nav-circles { display: flex; gap: 20px; }
        .nav-circles a {
            width: 100px; height: 100px; 
            border: 1.5px solid var(--gold);
            background: rgba(212, 175, 55, 0.05);
            border-radius: 50%; display: flex; justify-content: center;
            align-items: center; text-decoration: none; color: var(--gold);
            font-weight: bold; transition: 0.3s; text-align: center; font-size: 0.9rem;
            backdrop-filter: blur(2px);
        }
        .nav-circles a:hover { background: var(--gold); color: var(--night-blue); }

        .emo-btn {
            background: rgba(255,255,255,0.1); border: 1px solid var(--gold); 
            color: var(--gold); padding: 8px 18px; border-radius: 20px; 
            cursor: pointer; font-weight: bold; margin: 5px;
        }

        #ayah-display { margin-top: 25px; color: var(--gold); font-weight: bold; font-size: 1.2rem; min-height: 40px; }

        footer { text-align: center; width: 100%; padding-bottom: 20px; }
        .ceo-sign { font-size: 0.65rem; letter-spacing: 4px; color: var(--gold); opacity: 0.8; }
        .ceo-name { font-size: 1.8rem; font-family: 'Times New Roman', serif; font-weight: bold; color: var(--gold); }

        @keyframes floatUp {
            from { transform: translateY(0) scale(0.8); opacity: 0; }
            15% { opacity: 1; }
            85% { opacity: 1; }
            to { transform: translateY(-115vh) scale(1.2); opacity: 0; }
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.3); }
        }
    </style>
</head>
<body>

    <div id="stars-container"></div>

    <div class="menu-btn" onclick="toggleMenu()">☰</div>

    <div class="side-menu" id="sideMenu">
        <a href="index.html">🏠 الرئيسية</a>
        <a href="morning_azkar.html">☀️ أذكار الصباح</a>
        <a href="evening_azkar.html">🌙 أذكار المساء</a>
        <a href="istikhara.html">💍 دعاء الاستخارة</a>
        <a href="travel.html">✈️ دعاء السفر</a>
        <a href="prayer_azkar.html">📿 أذكار الصلاة</a>
        <a href="sleep_azkar.html">😴 أذكار النوم</a>
    </div>

    <div class="overlay" id="overlay" onclick="toggleMenu()"></div>

    <div id="app">
        <div class="nav-circles">
            <a href="morning_azkar.html">أذكار<br>الصباح</a>
            <a href="evening_azkar.html">أذكار<br>المساء</a>
        </div>

        <div class="main-content">
            <h1 style="font-size: 2.2rem; color: var(--gold); text-shadow: 0 0 10px rgba(212,175,55,0.3);">رمضان كريم</h1>
            <p style="opacity: 0.8;">2 رمضان 1447 هـ</p>
            
            <div class="emotions-bar">
                <button class="emo-btn" onclick="feel('sad')">قلق</button>
                <button class="emo-btn" onclick="feel('tired')">متعب</button>
                <button class="emo-btn" onclick="feel('happy')">فرحان</button>
            </div>
            <div id="ayah-display"></div>
        </div>

        <footer>
            <div class="ceo-sign">CEO-CO-FOUNDER</div>
            <span class="ceo-name">Houda</span>
        </footer>
    </div>

    <script>
        // فتح وقفل المنيو
        function toggleMenu() {
            const menu = document.getElementById('sideMenu');
            const overlay = document.getElementById('overlay');
            menu.classList.toggle('open');
            overlay.style.display = menu.classList.contains('open') ? 'block' : 'none';
        }

        // توليد النجوم
        const starsContainer = document.getElementById('stars-container');
        for (let i = 0; i < 100; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            const size = Math.random() * 2.5 + 'px';
            star.style.width = size;
            star.style.height = size;
            star.style.top = Math.random() * 100 + '%';
            star.style.left = Math.random() * 100 + '%';
            star.style.setProperty('--duration', (Math.random() * 3 + 2) + 's');
            starsContainer.appendChild(star);
        }

        // الأدعية العائمة
        const customDuas = [
            "اللهم صلِّ على محمد",
            "سبحان الله وبحمده",
            "سبحان الله العظيم",
            "أستغفر الله العظيم وأتوب إليه",
            "لا إله إلا الله وحده لا شريك له له الملك وله الحمد وهو على كل شيء قدير"
        ];

        function createFloatingDua() {
            const div = document.createElement('div');
            div.className = 'floating-dua';
            div.innerText = customDuas[Math.floor(Math.random() * customDuas.length)];
            div.style.left = Math.random() * 40 + 5 + "%";
            div.style.width = "90%"; 
            document.body.appendChild(div);
            setTimeout(() => div.remove(), 15000);
        }
        setInterval(createFloatingDua, 4500);

        function feel(type) {
            const display = document.getElementById('ayah-display');
            const responses = {
                sad: "﴿أَلَا بِذِكْرِ اللَّهِ تَطْمَئِنُّ الْقُلُوبُ﴾",
                tired: "﴿إِنَّ مَعَ الْعُسْرِ يُسْرًا﴾",
                happy: "﴿وَلَسَوْفَ يُعْطِيكَ رَبُّكَ فَتَرْضَىٰ﴾"
            };
            display.innerText = responses[type];
        }
    </script>
</body>
</html>
