<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Houda Edition | السماء الروحانية</title>
    <style>
        :root { 
            --gold: #d4af37; 
            --deep-sky: #0a192f; /* سماوي غامق جداً وفخم */
            --night-blue: #020c1b;
            --white: #ffffff;
        }
        
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background: radial-gradient(circle at center, var(--deep-sky) 0%, var(--night-blue) 100%); 
            color: var(--white);
            font-family: 'Segoe UI', sans-serif; overflow: hidden;
        }

        /* 1. النجوم الصغيرة (Stars Canvas) */
        #stars-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0; pointer-events: none;
        }
        .star {
            position: absolute; background: white; border-radius: 50%;
            opacity: 0.5; animation: twinkle var(--duration) infinite ease-in-out;
        }

        /* 2. الأدعية العائمة (Floating Duas) */
        .floating-dua {
            position: fixed; bottom: -60px; 
            color: rgba(255, 255, 255, 0.9);
            font-size: 1.1rem; font-weight: bold;
            text-shadow: 0 0 10px rgba(255,255,255,0.4);
            pointer-events: none; 
            animation: floatUp 14s linear infinite;
            z-index: 5; white-space: nowrap;
        }

        /* المحتوى الرئيسي */
        #app {
            display: flex; flex-direction: column; height: 100vh;
            justify-content: space-between; align-items: center; padding: 40px 20px;
            box-sizing: border-box; text-align: center;
            position: relative; z-index: 10;
        }

        .nav-circles { display: flex; gap: 20px; }
        .nav-circles a {
            width: 85px; height: 85px; 
            border: 1.5px solid var(--gold);
            background: rgba(212, 175, 55, 0.05);
            border-radius: 50%; display: flex; justify-content: center;
            align-items: center; text-decoration: none; color: var(--gold);
            font-weight: bold; transition: 0.3s;
        }

        .emo-btn {
            background: rgba(255,255,255,0.1); border: 1px solid var(--gold); 
            color: var(--gold); padding: 8px 18px; border-radius: 20px; 
            cursor: pointer; font-weight: bold; margin: 5px;
        }

        #ayah-display {
            margin-top: 25px; font-size: 1.2rem; font-weight: bold;
            color: var(--gold); min-height: 50px;
        }

        footer { text-align: center; width: 100%; padding-bottom: 20px; }
        .ceo-sign { font-size: 0.65rem; letter-spacing: 4px; color: var(--gold); opacity: 0.8; }
        .ceo-name { font-size: 1.6rem; font-family: 'Times New Roman', serif; font-weight: bold; color: var(--gold); }

        /* الأنميشن */
        @keyframes floatUp {
            from { transform: translateY(0) scale(0.9); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            to { transform: translateY(-110vh) scale(1.1); opacity: 0; }
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }
    </style>
</head>
<body>

    <div id="stars-container"></div>

    <div id="app">
        <div class="nav-circles">
            <a href="ward.html">الورد</a>
            <a href="azkar.html">الأذكار</a>
        </div>

        <div class="main-content">
            <h1 style="font-size: 2.2rem; color: var(--gold);">رمضان كريم</h1>
            <p style="opacity: 0.8;">2 رمضان 1447 هـ</p>
            
            <div class="emotions-bar">
                <button class="emo-btn" onclick="feel('sad')">قلق</button>
                <button class="emo-btn" onclick="feel('tired')">متعب</button>
                <button class="emo-btn" onclick="feel('happy')">فرحان</button>
            </div>
            <div id="ayah-display"></div>
        </div>

        <footer>
            <div class="ceo-sign">CEO-CO-FOUNDER</div>
            <span class="ceo-name">Houda</span>
        </footer>
    </div>

    <script>
        // 1. توليد النجوم عشوائياً
        const starsContainer = document.getElementById('stars-container');
        for (let i = 0; i < 80; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            const size = Math.random() * 3 + 'px';
            star.style.width = size;
            star.style.height = size;
            star.style.top = Math.random() * 100 + '%';
            star.style.left = Math.random() * 100 + '%';
            star.style.setProperty('--duration', (Math.random() * 3 + 2) + 's');
            starsContainer.appendChild(star);
        }

        // 2. الأدعية العائمة
        const duas = ["سُبْحَانَ اللَّهِ", "الْحَمْدُ لِلَّهِ", "لَا إِلَهَ إِلَّا اللَّهُ", "اللَّهُ أَكْبَرُ", "أستغفر الله", "اللهم صلِّ على محمد"];
        function createFloatingDua() {
            const div = document.createElement('div');
            div.className = 'floating-dua';
            div.innerText = duas[Math.floor(Math.random() * duas.length)];
            div.style.left = Math.random() * 80 + 10 + "%";
            document.body.appendChild(div);
            setTimeout(() => div.remove(), 14000);
        }
        setInterval(createFloatingDua, 3500);

        const responses = {
            sad: "﴿أَلَا بِذِكْرِ اللَّهِ تَطْمَئِنُّ الْقُلُوبُ﴾",
            tired: "﴿إِنَّ مَعَ الْعُسْرِ يُسْرًا﴾",
            happy: "﴿وَلَسَوْفَ يُعْطِيكَ رَبُّكَ فَتَرْضَىٰ﴾"
        };

        function feel(type) {
            const display = document.getElementById('ayah-display');
            display.style.opacity = 0;
            setTimeout(() => {
                display.innerText = responses[type];
                display.style.opacity = 1;
            }, 300);
        }
    </script>
</body>
</html>
