<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Houda Universe | رمضان 2026</title>
    <style>
        :root { --gold: #d4af37; --black: #050505; }
        
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background: var(--black); color: var(--gold);
            font-family: 'Segoe UI', sans-serif; overflow: hidden;
        }

        /* 1. الفن التوليدي (Canvas الخلفية) */
        #bg-canvas {
            position: fixed; top: 0; left: 0; z-index: -1;
        }

        /* 2. الأدعية العائمة (Floating Duas) */
        .floating-dua {
            position: fixed; bottom: -50px; color: rgba(212, 175, 55, 0.2);
            font-size: 0.9rem; pointer-events: none; animation: floatUp 15s linear infinite;
        }

        /* 3. مساعد المشاعر (Emotion AI UI) */
        .emotions-bar {
            display: flex; gap: 15px; margin-top: 20px;
        }
        .emo-btn {
            background: none; border: 1px solid var(--gold); color: var(--gold);
            padding: 5px 10px; border-radius: 20px; cursor: pointer; font-size: 0.7rem;
        }

        /* شاشة التحدي (Social Challenge) */
        .social-counter {
            position: fixed; top: 10px; right: 10px; font-size: 0.7rem; opacity: 0.6;
        }

        /* التصميم العام */
        #app {
            display: flex; flex-direction: column; height: 100vh;
            justify-content: space-between; align-items: center; padding: 40px 20px;
            box-sizing: border-box; text-align: center;
        }

        .nav-circles a {
            width: 80px; height: 80px; border: 1px solid var(--gold);
            border-radius: 50%; display: flex; justify-content: center;
            align-items: center; text-decoration: none; color: var(--gold);
            font-weight: bold; font-size: 0.8rem; margin: 0 10px;
        }

        footer { text-align: center; }
        .ceo-name { font-size: 1.5rem; font-family: serif; font-weight: bold; display: block; }

        @keyframes floatUp {
            from { transform: translateY(0); opacity: 0; }
            50% { opacity: 0.5; }
            to { transform: translateY(-110vh); opacity: 0; }
        }
    </style>
</head>
<body>

    <canvas id="bg-canvas"></canvas>

    <div class="social-counter">هناك <span id="online-count">128</span> شخصاً يسبحون معك الآن ⚡</div>

    <div id="app">
        <div class="nav-circles" style="display:flex;">
            <a href="ward.html">الورد</a>
            <a href="azkar.html">الأذكار</a>
        </div>

        <div class="main-content">
            <h1 id="main-greeting">رمضان كريم</h1>
            
            <p style="font-size: 0.8rem;">كيف حال قلبك الآن؟</p>
            <div class="emotions-bar">
                <button class="emo-btn" onclick="feel('sad')">قلق</button>
                <button class="emo-btn" onclick="feel('tired')">متعب</button>
                <button class="emo-btn" onclick="feel('happy')">فرحان</button>
            </div>
            <div id="ayah-display" style="margin-top:20px; font-style: italic; min-height: 40px;"></div>
        </div>

        <footer>
            <div style="font-size: 0.6rem; letter-spacing: 3px;">CEO-CO-FOUNDER</div>
            <span class="ceo-name">Houda</span>
        </footer>
    </div>

    <script>
        // 1. كود الفن التوليدي (رسم خيوط ذهبية عشوائية)
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        function drawArt() {
            ctx.strokeStyle = 'rgba(212, 175, 55, 0.1)';
            ctx.lineWidth = 0.5;
            ctx.beginPath();
            ctx.moveTo(Math.random() * canvas.width, Math.random() * canvas.height);
            ctx.lineTo(Math.random() * canvas.width, Math.random() * canvas.height);
            ctx.stroke();
        }
        setInterval(drawArt, 2000); // رسم خط كل ثانيتين

        // 2. كود الأدعية العائمة
        const duas = ["سبحان الله", "الحمد لله", "اللهم إنك عفو تحب العفو فاعف عنا", "يا حي يا قيوم"];
        function createFloatingDua() {
            const div = document.createElement('div');
            div.className = 'floating-dua';
            div.innerText = duas[Math.floor(Math.random() * duas.length)];
            div.style.left = Math.random() * 80 + 10 + "%";
            document.body.appendChild(div);
            setTimeout(() => div.remove(), 15000);
        }
        setInterval(createFloatingDua, 4000);

        // 3. كود مساعد المشاعر (Emotion AI)
        const responses = {
            sad: "ألا بذكر الله تطمئن القلوب",
            tired: "واستعينوا بالصبر والصلاة",
            happy: "لئن شكرتم لأزيدنكم"
        };
        function feel(type) {
            const display = document.getElementById('ayah-display');
            display.style.opacity = 0;
            setTimeout(() => {
                display.innerText = responses[type];
                display.style.opacity = 1;
                // تأثير "تحدي النور": وميض عند التفاعل
                ctx.fillStyle = 'rgba(212, 175, 55, 0.2)';
                ctx.fillRect(0,0,canvas.width, canvas.height);
                setTimeout(() => ctx.clearRect(0,0,canvas.width, canvas.height), 100);
            }, 300);
        }

        // محاكاة عدد المتواجدين
        setInterval(() => {
            const count = document.getElementById('online-count');
            count.innerText = Math.floor(Math.random() * (150 - 120) + 120);
        }, 5000);
    </script>
</body>
</html>
