<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق اذكاري | الأذكار</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" href="icon.png" type="image/png">

    <style>
        :root { 
            --gold: #d4af37; 
            --deep-sky: #0a192f; 
            --night-blue: #020c1b;
            --white: #ffffff;
        }
        
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background: radial-gradient(circle at center, var(--deep-sky) 0%, var(--night-blue) 100%); 
            color: var(--white); font-family: 'Segoe UI', sans-serif; overflow: hidden;
        }

        .menu-btn {
            position: fixed; top: 20px; right: 20px;
            font-size: 1.8rem; color: var(--gold);
            cursor: pointer; z-index: 9999;
            background: rgba(10, 25, 47, 0.9);
            padding: 8px 12px; border-radius: 12px;
            border: 2px solid var(--gold);
        }

        .side-menu {
            position: fixed; top: 0; right: -280px;
            width: 260px; height: 100%;
            background: var(--night-blue);
            border-left: 3px solid var(--gold);
            z-index: 10000; transition: 0.4s;
            padding-top: 80px; display: flex; flex-direction: column;
        }
        .side-menu.open { right: 0; }
        .side-menu a {
            color: var(--white); text-decoration: none;
            padding: 15px 25px; border-bottom: 1px solid rgba(212, 175, 55, 0.1);
            font-size: 1.1rem; text-align: right;
        }

        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); display: none; z-index: 9998;
        }

        #app {
            display: flex; flex-direction: column; height: 100vh;
            justify-content: center; align-items: center; 
            position: relative; z-index: 10; text-align: center;
        }

        .main-title { font-size: 2.5rem; color: var(--gold); margin-bottom: 5px; }
        
        #ramadan-date {
            font-size: 1.3rem; color: var(--gold);
            background: rgba(212, 175, 55, 0.1);
            padding: 8px 25px; border-radius: 20px;
            border: 1px solid var(--gold); margin-bottom: 20px;
        }

        /* بطاقة آية اليوم */
        .ayah-card {
            margin: 20px; padding: 15px; max-width: 300px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px; border: 1px dashed var(--gold);
        }

        footer { position: absolute; bottom: 20px; width: 100%; }
        .ceo-name { color: var(--gold); font-size: 1.4rem; font-weight: bold; letter-spacing: 2px; }

        #stars-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; }
        .star { position: absolute; background: white; border-radius: 50%; animation: twinkle var(--duration) infinite; }
        @keyframes twinkle { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
    </style>
</head>
<body>

    <div id="stars-container"></div>
    <div class="menu-btn" onclick="toggleMenu()">☰</div>

    <div class="side-menu" id="sideMenu">
        <a href="index.html">🏠 الرئيسية</a>
        <a href="#" onclick="enableNotifications()" style="color: #4ade80;">🔔 تفعيل الإشعارات</a>
        <a href="morning.html">☀️ أذكار الصباح</a>
        <a href="evening.html">🌙 أذكار المساء</a>
        <a href="istikhara.html">💍 دعاء الاستخارة</a>
        <a href="worry.html">😔 أدعية الهم والحزن</a>
        <a href="ramadan.html">🌙 أدعية رمضان</a>
        <a href="tasks.html">✅ ورد المحاسبة اليومي</a>
    </div>

    <div class="overlay" id="overlay" onclick="toggleMenu()"></div>

    <div id="app">
        <h1 class="main-title">رمضان كريم</h1>
        <div id="ramadan-date">جاري التحميل...</div>

        <div class="ayah-card">
            <small style="color: var(--gold);">✨ آية لقلبك</small>
            <p id="ayah-text" style="font-size: 1.1rem; margin-top: 10px;">﴿إِنَّ مَعَ الْعُسْرِ يُسْرًا﴾</p>
        </div>

        <footer>
            <div style="font-size: 0.7rem; color: var(--gold); opacity: 0.6;">CEO-CO-FOUNDER</div>
            <div class="ceo-name">HOUDA</div>
        </footer>
    </div>

    <script>
        // 1. فتح المنيو
        function toggleMenu() {
            const menu = document.getElementById('sideMenu');
            const overlay = document.getElementById('overlay');
            menu.classList.toggle('open');
            overlay.style.display = menu.classList.contains('open') ? 'block' : 'none';
        }

        // 2. التاريخ الهجري التلقائي
        function updateDate() {
            const today = new Date();
            // تعديل بسيط ليوافق رمضان 1447هـ
            const options = { day: 'numeric', month: 'long', year: 'numeric' };
            const hijriDate = new Intl.DateTimeFormat('ar-SA-u-ca-islamic-uma', options).format(today);
            document.getElementById('ramadan-date').innerText = hijriDate;
        }

        // 3. تفعيل الإشعارات (للمستخدمين اللي نزلوا التطبيق)
        function enableNotifications() {
            if (!("Notification" in window)) {
                alert("متصفحك لا يدعم الإشعارات");
                return;
            }
            Notification.requestPermission().then(permission => {
                if (permission === "granted") {
                    navigator.serviceWorker.ready.then(reg => {
                        reg.showNotification('تم التفعيل يا حوده! ✅', {
                            body: 'ستصلك الأذكار تلقائياً حتى والتطبيق مقفول.',
                            icon: 'icon.png'
                        });
                    });
                }
            });
        }

        // 4. آية اليوم المتغيرة
        function setDailyAyah() {
            const ayat = [
                "﴿وَبَشِّرِ الصَّابِرِينَ﴾",
                "﴿أَلَا بِذِكْرِ اللَّهِ تَطْمَئِنُّ الْقُلُوبُ﴾",
                "﴿لَا تَدْرِي لَعَلَّ اللَّهَ يُحْدِثُ بَعْدَ ذَلِكَ أَمْرًا﴾",
                "﴿وَلَسَوْفَ يُعْطِيكَ رَبُّكَ فَتَرْضَىٰ﴾"
            ];
            const day = new Date().getDate();
            document.getElementById('ayah-text').innerText = ayat[day % ayat.length];
        }

        // 5. توليد النجوم
        const container = document.getElementById('stars-container');
        for (let i = 0; i < 60; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            star.style.width = Math.random() * 3 + 'px';
            star.style.height = star.style.width;
            star.style.top = Math.random() * 100 + '%';
            star.style.left = Math.random() * 100 + '%';
            star.style.setProperty('--duration', (Math.random() * 3 + 2) + 's');
            container.appendChild(star);
        }

        // تشغيل كل الوظائف عند التحميل
        window.onload = () => {
            updateDate();
            setDailyAyah();
            // تسجيل الـ Service Worker للإشعارات
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('sw.js');
            }
        };
    </script>
</body>
</html>
