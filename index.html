<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رمضان 2026 | Houda Platform</title>
    <style>
        :root {
            --gold: #d4af37;
            --bg-color: #0a0a0a; /* سيتغير تلقائياً */
            --accent: rgba(212, 175, 55, 0.4);
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: var(--bg-color);
            color: var(--gold);
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
            transition: background 2s ease; /* لتغيير لون الوقت بسلاسة */
        }

        /* 1. تأثير وقت اليوم (Dynamic Time UI) */
        .time-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: -1;
            opacity: 0.5;
        }

        /* 2. بوصلة القلوب (الزخرفة المتحركة) */
        #qibla-compass {
            position: absolute; top: 20%; left: 50%;
            transform: translateX(-50%);
            width: 150px; height: 150px;
            border: 1px solid var(--gold);
            border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            transition: transform 0.1s ease;
        }
        #qibla-compass::after {
            content: '▲'; position: absolute; top: -10px; font-size: 12px;
        }

        /* شاشة الترحيب */
        #splash {
            position: fixed; top: 0; width: 100%; height: 100%;
            background: #000; z-index: 9999;
            display: flex; justify-content: center; align-items: center;
            transition: 1s;
        }

        /* المحتوى */
        #main-app {
            display: none; height: 100vh; flex-direction: column;
            justify-content: space-between; align-items: center; padding: 30px;
            box-sizing: border-box; z-index: 10;
        }

        .nav-circles { display: flex; gap: 20px; }
        .nav-circles a {
            width: 90px; height: 90px; border: 2px solid var(--gold);
            border-radius: 50%; display: flex; justify-content: center;
            align-items: center; text-decoration: none; color: var(--gold);
            font-weight: bold; font-size: 0.8rem;
            box-shadow: 0 0 15px var(--accent);
        }

        /* 3. خريطة نور العمل (Heatmap) */
        .heatmap {
            display: grid; grid-template-columns: repeat(10, 1fr); gap: 5px;
            margin-top: 20px;
        }
        .dot { width: 8px; height: 8px; background: #222; border-radius: 2px; }
        .dot.active { background: var(--gold); box-shadow: 0 0 5px var(--gold); }

        footer { text-align: center; padding-bottom: 20px; }
        .ceo-sign { font-size: 0.7rem; letter-spacing: 3px; opacity: 0.6; }
        .ceo-name { font-size: 1.5rem; font-family: serif; font-weight: bold; }

    </style>
</head>
<body id="main-body">

    <div id="splash">
        <div style="text-align:center;">
            <div id="loader-pentagon" style="font-size: 50px;">🌙</div>
            <h2 style="color:var(--gold)">Houda Edition</h2>
        </div>
    </div>

    <div id="main-app">
        <div id="qibla-compass">
            <div style="font-size: 0.6rem; text-align: center;">بوصلة<br>القلوب</div>
        </div>

        <div class="nav-circles">
            <a href="ward.html">الورد</a>
            <a href="azkar.html">الأذكار</a>
        </div>

        <div class="status">
            <h1 id="time-greeting">رمضان كريم</h1>
            <p id="day-num">2 رمضان</p>
            
            <div class="heatmap" id="heatmap">
                </div>
            <p style="font-size: 0.6rem; margin-top: 10px;">خريطة نور العمل</p>
        </div>

        <footer>
            <div class="ceo-sign">CEO-CO-FOUNDER</div>
            <div class="ceo-name">Houda</div>
        </footer>
    </div>

    <script>
        // 1. نظام الوقت المتغير (Dynamic Time UI)
        function updateTimeStyle() {
            const hour = new Date().getHours();
            const body = document.getElementById('main-body');
            const greeting = document.getElementById('time-greeting');

            if (hour >= 5 && hour < 12) { // الصباح
                body.style.backgroundColor = "#1a1a2e"; // أزرق صبحي
                greeting.innerText = "صباح الذاكرين";
            } else if (hour >= 12 && hour < 17) { // الظهر
                body.style.backgroundColor = "#2c1e0a"; // بني ذهبي
                greeting.innerText = "طاب يومك بالخير";
            } else if (hour >= 17 && hour < 19) { // قبل المغرب
                body.style.backgroundColor = "#3d1111"; // أرجواني مغربي
                greeting.innerText = "اقترب الإفطار";
            } else { // الليل
                body.style.backgroundColor = "#050505"; // أسود ليل
                greeting.innerText = "ليلة مباركة";
            }
        }

        // 2. بوصلة القلوب (استخدام الجيروسكوب)
        window.addEventListener('deviceorientation', (event) => {
            const compass = document.getElementById('qibla-compass');
            if(event.webkitCompassHeading) {
                // للآيفون
                compass.style.transform = `translateX(-50%) rotate(${event.webkitCompassHeading}deg)`;
            } else {
                // للأندرويد
                compass.style.transform = `translateX(-50%) rotate(${event.alpha}deg)`;
            }
        });

        // 3. خريطة نور العمل (توليد نقاط الشهر)
        const heatmap = document.getElementById('heatmap');
        for(let i=0; i<30; i++) {
            let dot = document.createElement('div');
            dot.className = 'dot';
            if(i < 2) dot.className = 'dot active'; // اليوم هو 2 رمضان
            heatmap.appendChild(dot);
        }

        // إخفاء الترحيب
        setTimeout(() => {
            document.getElementById('splash').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('splash').style.display = 'none';
                document.getElementById('main-app').style.display = 'flex';
                updateTimeStyle();
            }, 800);
        }, 2000);

        // 4. ميزة الهزاز (ستحتاج تفعيلها في صفحة الأذكار)
        function triggerVibration() {
            if ("vibrate" in navigator) {
                navigator.vibrate(50); // يهتز لمدة 50 مللي ثانية
            }
        }
    </script>
</body>
</html>
