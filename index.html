<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق اذكاري | موسوعة الأذكار</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" href="icon.png" type="image/png">

    <style>
        :root { 
            --gold: #d4af37; 
            --deep-sky: #0a192f; 
            --night-blue: #020c1b;
            --white: #ffffff;
        }
        
        body, html { 
            margin: 0; padding: 0; width: 100%; height: 100%; 
            background: radial-gradient(circle at center, var(--deep-sky) 0%, var(--night-blue) 100%); 
            color: var(--white); font-family: 'Segoe UI', sans-serif; overflow: hidden;
        }

        /* زرار الـ 3 شرط */
        .menu-btn {
            position: fixed; top: 20px; right: 20px;
            font-size: 1.8rem; color: var(--gold);
            cursor: pointer; z-index: 9999;
            background: rgba(10, 25, 47, 0.9);
            padding: 8px 12px; border-radius: 12px;
            border: 2px solid var(--gold);
        }

        /* القائمة الجانبية */
        .side-menu {  
            position: fixed; top: 0; right: -280px;
            width: 260px; height: 100%;
            background: var(--night-blue);
            border-left: 3px solid var(--gold);
            z-index: 10000; transition: 0.4s;
            padding-top: 80px; display: flex; flex-direction: column;
        }
        .side-menu.open { right: 0; }
        .side-menu a {
            color: var(--white); text-decoration: none;
            padding: 15px 25px; border-bottom: 1px solid rgba(212, 175, 55, 0.1);
            font-size: 1.1rem; text-align: right;
        }
        .side-menu a:hover { background: var(--gold); color: var(--night-blue); }

        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); display: none; z-index: 9998;
        }

        #stars-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; }
        .star { position: absolute; background: white; border-radius: 50%; animation: twinkle var(--duration) infinite; }

        #app {
            display: flex; flex-direction: column; height: 100vh;
            justify-content: center; align-items: center; 
            position: relative; z-index: 10; text-align: center;
        }

        .main-title { font-size: 2.8rem; color: var(--gold); margin-bottom: 5px; text-shadow: 0 0 15px rgba(212,175,55,0.4); }
        
        /* مربع التاريخ */
        #ramadan-date {
            font-size: 1.4rem; color: var(--gold);
            background: rgba(212, 175, 55, 0.1);
            padding: 10px 30px; border-radius: 25px;
            border: 1px double var(--gold);
            margin-bottom: 20px; font-weight: bold;
        }

        .floating-dua {
            position: fixed; bottom: -100px; color: rgba(255,255,255,0.7);
            font-size: 1.1rem; font-weight: bold; width: 100%; text-align: center;
            animation: floatUp 15s linear infinite;
        }

        @keyframes floatUp { from { transform: translateY(0); opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } to { transform: translateY(-115vh); opacity: 0; } }
        @keyframes twinkle { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }

        footer { position: absolute; bottom: 20px; width: 100%; }
        .ceo-name { color: var(--gold); font-size: 1.5rem; font-weight: bold; letter-spacing: 3px; }
    </style>
</head>
<body>

    <div id="stars-container"></div>
    <div class="menu-btn" onclick="toggleMenu()">☰</div>

    <div class="side-menu" id="sideMenu">
        <a href="index.html">🏠 الرئيسية</a>
        <a href="morning.html">☀️ أذكار الصباح</a>
        <a href="evening.html">🌙 أذكار المساء</a>
        <a href="istikhara.html">💍 دعاء الاستخارة</a>
        <a href="worry.html">😔 أدعية الهم والحزن</a>
        <a href="ramadan.html">🌙 أدعية رمضان</a>
        <a href="tasks.html">✅ ورد المحاسبة اليومي</a>
    </div>

    <div class="overlay" id="overlay" onclick="toggleMenu()"></div>

    <div id="app">
        <h1 class="main-title">رمضان كريم</h1>
        
        <div id="ramadan-date">جاري الضبط...</div>

        <div id="quote" style="color: white; opacity: 0.8; font-size: 1.2rem;"></div>

        <footer>
            <div style="font-size: 0.7rem; color: var(--gold); opacity: 0.6;">CEO-CO-FOUNDER</div>
            <div class="ceo-name">HOUDA</div>
        </footer>
    </div>

    <script>
        function toggleMenu() {
            const menu = document.getElementById('sideMenu');
            const overlay = document.getElementById('overlay');
            menu.classList.toggle('open');
            overlay.style.display = menu.classList.contains('open') ? 'block' : 'none';
        }

        // كود التاريخ الهجري الذكي والمعدل
        function updateHijriDate() {
            try {
                const today = new Date();
                
                // إضافة يوم واحد عشان يظبط معاك (1 رمضان)
                today.setDate(today.getDate() + 1);

                const options = { day: 'numeric', month: 'long', year: 'numeric' };
                let hijriDate = new Intl.DateTimeFormat('ar-SA-u-ca-islamic-uma', options).format(today);
                
                // تأكيد كتابة "رمضان" لو الموبايل قلب ميلادي
                if (hijriDate.includes('فبراير') || hijriDate.includes('February')) {
                    // حساب اليوم يدوياً لو الخاصية مش مدعومة في المتصفح
                    let day = today.getDate() - 18; // عملية حسابية تقريبية لرمضان 1447
                    document.getElementById('ramadan-date').innerText = day + " رمضان 1447 هـ";
                } else {
                    document.getElementById('ramadan-date').innerText = hijriDate;
                }
            } catch (e) {
                document.getElementById('ramadan-date').innerText = "2 رمضان 1447 هـ";
            }
        }
        updateHijriDate();

        // نجوم
        const container = document.getElementById('stars-container');
        for (let i = 0; i < 80; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            star.style.width = Math.random() * 3 + 'px';
            star.style.height = star.style.width;
            star.style.top = Math.random() * 100 + '%';
            star.style.left = Math.random() * 100 + '%';
            star.style.setProperty('--duration', (Math.random() * 3 + 2) + 's');
            container.appendChild(star);
        }

        // أدعية
        const duas = ["سبحان الله", "الحمد لله", "أستغفر الله", "اللهم صلِّ على محمد"];
        function spawnDua() {
            const d = document.createElement('div');
            d.className = 'floating-dua';
            d.innerText = duas[Math.floor(Math.random() * duas.length)];
            d.style.left = Math.random() * 60 + 20 + '%';
            document.body.appendChild(d);
            setTimeout(() => d.remove(), 15000);
        }
        setInterval(spawnDua, 4500);

        const quotes = ["﴿أَلَا بِذِكْرِ اللَّهِ تَطْمَئِنُّ الْقُلُوبُ﴾", "﴿إِنَّ مَعَ الْعُسْرِ يُسْرًا﴾"];
        document.getElementById('quote').innerText = quotes[Math.floor(Math.random() * quotes.length)];
    </script>
</body>
</html>
